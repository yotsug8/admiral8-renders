# Рендер выпуска в облаке GitHub (или дубли озвучки / прослушка голосов по кнопке).
# Быстро: рендерится только изменённый выпуск, кадры — в 4 потока, зависимости, картинки и озвучка из кэша.
name: render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      takes:
        description: "выпуск для дублей озвучки (пусто — обычный рендер)"
        default: ""
      voices:
        description: "подбор голоса: list или id через запятую"
        default: ""
      vtext:
        description: "фраза для прослушки голосов (пусто — стандартная)"
        default: ""
      ep:
        description: "имя выпуска, например demo_layouts (пусто — последний коммит; push — весь диапазон)"
        default: ""
      silent:
        description: "1 — без озвучки (тишина, тайминги по темпу речи)"
        default: ""
      draft:
        description: "1 — черновик: половина размера, 15 кадров/с, файл NNN_draft.mp4"
        default: ""
      audition:
        description: "прослушка на видео: id:Название,… (нужен ep) — хук и первый факт каждым голосом"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      CI_EP: ${{ inputs.ep }}
      CI_TAKES: ${{ inputs.takes }}
      CI_VOICES: ${{ inputs.voices }}
      CI_AUDITION: ${{ inputs.audition }}
      FV_SILENT: ${{ inputs.silent }}
      FV_DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # весь before..sha, включая push из нескольких коммитов
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Кэш пакетов, браузера и модели распознавания: повторные запуски без скачивания
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: render-deps-v2
      # Кэш выпусков: справочники, картинки CDN, озвучка Fish и распознавание дублей — перерендер не делает их заново
      - uses: actions/cache@v4
        with:
          path: cache
          key: render-cache-${{ github.run_id }}
          restore-keys: render-cache-
      - name: Какие выпуски рендерить
        id: eps
        if: ${{ (inputs.takes == '' || inputs.takes == null) && (inputs.voices == '' || inputs.voices == null) }}
        env:
          CI_BEFORE: ${{ github.event.before }}
        run: python tools/ci_artifacts.py select
      - name: Зависимости
        if: ${{ steps.eps.outputs.list != '' }}
        run: |
          pip install -q pillow numpy edge-tts playwright faster-whisper imageio-ffmpeg
          python -m playwright install chromium
      - name: Подбор голоса
        if: ${{ inputs.voices != '' && inputs.voices != null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FV_VOICE_TEXT: ${{ inputs.vtext }}
        run: |
          set -o pipefail
          mkdir -p out
          pip install -q pillow numpy
          python video.py --voices "$CI_VOICES" out 2>&1 | tee out/render.log
      - name: Дубли озвучки
        if: ${{ inputs.takes != '' && inputs.takes != null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q pillow numpy faster-whisper
          FV_TAKES_ANALYZE=1 python video.py --takes "$CI_TAKES" out 2>&1 | tee out/render.log
      - name: Рендер
        if: ${{ steps.eps.outputs.list != '' }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          EPISODES: ${{ steps.eps.outputs.list }}
        run: |
          set -o pipefail
          mkdir -p out
          T0=$(date +%s)
          if [ -n "$CI_AUDITION" ]; then
            FV_WORKERS=4 python video.py --audition "episodes/$CI_EP.json" "$CI_AUDITION" out 2>&1 | tee -a out/render.log
            echo "рендер занял $(( $(date +%s) - T0 )) с" | tee -a out/render.log; exit 0
          fi
          SUFFIX=""; if [ "$FV_DRAFT" = 1 ]; then SUFFIX="_draft"; fi
          read -r -a EPISODE_NAMES <<< "$EPISODES"
          for n in "${EPISODE_NAMES[@]}"; do
            echo "== Выпуск $n" | tee -a out/render.log
            FV_WORKERS=4 python video.py "episodes/$n.json" "out/$n$SUFFIX.mp4" 2>&1 | tee -a out/render.log
          done
          echo "рендер занял $(( $(date +%s) - T0 )) с" | tee -a out/render.log
      # Готовые ролики кладём в ветку renders: оттуда их удобно скачать и смотреть на GitHub
      - name: Публикация в ветку renders
        if: always()          # лог публикуется и при ошибке — чтобы было видно причину
        run: |
          BR=renders
          if [ -n "$CI_TAKES$CI_VOICES" ]; then BR=takes; fi
          python tools/ci_artifacts.py publish out "$BR"
