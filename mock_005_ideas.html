<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-cyrillic-900-normal.woff2); }
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-cyrillic-800-normal.woff2); }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-latin-800-normal.woff2); unicode-range: U+0000-00FF; }
/* Макеты идей визуала для выпуска 005 (тема «Адмирал»): маршрут, мини-схема, было→стало, реакция героя */
:root { --ink: #eef6fb; --acc: #5fd4c4; --hot: #ff4d5e; --dark: #020a14; --line: rgba(238,246,251,.22); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #061627; color: var(--ink); font-family: Manrope; }
.bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(40,90,140,.35), transparent 70%),
  linear-gradient(rgba(238,246,251,.045) 2px, transparent 2px), linear-gradient(90deg, rgba(238,246,251,.045) 2px, transparent 2px);
  background-size: auto, 120px 120px, 120px 120px; }
.waves { position: absolute; left: 0; top: 1660px; width: 1080px; height: 260px; background:
  radial-gradient(ellipse 90px 30px at 90px 0, transparent 70%, #12507a 72%) 0 30px / 180px 60px repeat-x, linear-gradient(#12507a, #1b6f93); }
.head { position: absolute; left: 60px; top: 245px; font: 900 84px/1.04 Unbounded; }
.head .on { color: var(--acc); } .head .off { opacity: .4; }
.hero { position: absolute; right: 50px; top: 170px; height: 330px; filter: drop-shadow(0 0 24px rgba(95,212,196,.5)); }
.card { position: absolute; left: 60px; width: 880px; border-radius: 22px; background: linear-gradient(180deg, #11355a, #0a2340); border: 4px solid var(--line);
  box-shadow: 0 12px 0 rgba(2,10,20,.65); display: flex; align-items: center; gap: 26px; padding: 0 30px; }
.card.on { border-color: var(--acc); box-shadow: 0 12px 0 rgba(2,10,20,.65), 0 0 26px rgba(95,212,196,.35); }
.card.dim { opacity: .5; }
.ics { display: flex; align-items: center; gap: 10px; flex: none; }
.ics img { border-radius: 14px; border: 3px solid var(--ink); }
.ics .ab { width: 128px; height: 128px; } .ics .it { width: 88px; height: 64px; border-radius: 10px; }
.ics s { font: 900 40px Unbounded; text-decoration: none; }
.tx { flex: 1; min-width: 0; }
.v { display: inline-block; padding: 6px 16px 9px; border-radius: 8px; background: var(--ink); color: #0a2340; border-left: 12px solid var(--hot); font: 900 34px/1 Unbounded; margin-bottom: 12px; }
.tx b { display: block; font: 900 40px/1.08 Unbounded; text-transform: uppercase; }
.tx span { display: block; margin-top: 10px; font: 800 32px/1.15 Manrope; opacity: .8; }
.tag { position: absolute; right: -10px; top: -18px; padding: 4px 14px 7px; border-radius: 10px; font: 900 26px/1 Unbounded; color: var(--dark); background: var(--acc); }
.subs { position: absolute; left: 60px; width: 880px; top: 1468px; text-align: center; font: 800 56px Manrope; }
.subs i { font-style: normal; background: var(--acc); color: var(--dark); padding: 2px 12px; border-radius: 12px; }
.lab { position: absolute; left: 60px; top: 120px; padding: 8px 18px; border-radius: 12px; background: var(--hot); color: #fff; font: 900 34px Unbounded; }
/* 1. Маршрут по карте */
.route { position: absolute; left: 60px; top: 520px; width: 880px; height: 150px; }
.route svg { position: absolute; inset: 0; overflow: visible; }
.isl { position: absolute; top: 46px; width: 92px; margin-left: -46px; text-align: center; }
.isl i { display: block; margin: 0 auto; width: 46px; height: 46px; border-radius: 50%; background: #2a8fa0; border: 5px solid var(--ink); }
.isl.past i { background: var(--acc); } .isl.cur i { background: var(--hot); width: 56px; height: 56px; margin-top: -5px; box-shadow: 0 0 22px var(--hot); }
.isl b { display: block; margin-top: 8px; font: 900 26px Unbounded; } .isl.fut { opacity: .45; }
.ship { position: absolute; top: -6px; font-size: 54px; }
/* 2. Мини-схема */
.scheme { position: relative; width: 250px; height: 250px; flex: none; border-radius: 50%; background: radial-gradient(circle, rgba(95,212,196,.12), rgba(2,10,20,.6));
  border: 3px dashed rgba(238,246,251,.35); }
.scheme .k { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; background: var(--ink); border: 5px solid #0a2340; }
.scheme .t { position: absolute; width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 8px rgba(95,212,196,.25), 0 0 0 18px rgba(95,212,196,.12); }
.scheme .t.old { opacity: .35; box-shadow: none; }
.cross { position: absolute; width: 110px; height: 110px; margin: -55px; border-radius: 50%; border: 5px solid var(--hot); }
.cross:before, .cross:after { content: ""; position: absolute; background: var(--hot); }
.cross:before { left: 50%; top: -18px; bottom: -18px; width: 5px; margin-left: -2px; } .cross:after { top: 50%; left: -18px; right: -18px; height: 5px; margin-top: -2px; }
/* 3. Было → стало */
.nums { display: flex; gap: 14px; margin-top: 14px; }
.num { padding: 6px 14px 9px; border-radius: 12px; background: rgba(2,10,20,.55); border: 3px solid var(--line); font: 900 34px Unbounded; white-space: nowrap; }
.num del { color: rgba(238,246,251,.45); text-decoration-color: var(--hot); text-decoration-thickness: 5px; }
.num ins { text-decoration: none; color: var(--hot); }
/* 4. Реакция героя */
.hero.hit { filter: grayscale(.7) brightness(.6) drop-shadow(0 0 30px rgba(255,77,94,.9)); transform: translateX(-10px) rotate(-3deg); }
.shk { position: absolute; font: 900 60px Unbounded; color: var(--hot); }
/* ===== Вариант Б: иерархия — активная карточка крупно, остальные полосками ===== */
.head.b { font-size: 104px; top: 230px; }
.hero.b { right: 30px; top: 150px; height: 470px; }
.route.b { top: 560px; height: 170px; }
.route.b .isl { width: 120px; margin-left: -60px; }
.route.b .isl i { width: 58px; height: 58px; } .route.b .isl.cur i { width: 72px; height: 72px; margin-top: -7px; }
.route.b .isl b { font-size: 32px; } .route.b .ship { font-size: 70px; top: -26px; }
.big { position: absolute; left: 60px; width: 880px; border-radius: 30px; background: linear-gradient(180deg, #13406a, #0a2340); border: 5px solid var(--acc);
  box-shadow: 0 14px 0 rgba(2,10,20,.65), 0 0 34px rgba(95,212,196,.35); padding: 34px 36px; display: flex; gap: 30px; }
.big .l { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.big .ics .ab { width: 176px; height: 176px; border-radius: 22px; border-width: 4px; }
.big .ics .it { width: 123px; height: 90px; border-radius: 14px; }
.big .ics s { font-size: 54px; }
.big b { display: block; margin-top: 22px; font: 900 54px/1.04 Unbounded; text-transform: uppercase; letter-spacing: -.02em; }
.big span { display: block; margin-top: 12px; font: 800 36px/1.15 Manrope; opacity: .85; }
.big .v { font-size: 40px; align-self: flex-start; }
.big .scheme { width: 330px; height: 330px; align-self: center; }
.big .scheme .k { width: 40px; height: 40px; margin: -20px; }
.big .scheme .t { width: 34px; height: 34px; margin: -17px; }
.strip { position: absolute; left: 60px; width: 880px; height: 96px; border-radius: 18px; background: rgba(13,42,71,.75); border: 3px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 0 22px; font: 900 34px Unbounded; text-transform: uppercase; }
.strip img { width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--ink); }
.strip .v { margin: 0; font-size: 28px; padding: 5px 12px 7px; }
.strip.past { opacity: .55; } .strip.fut { opacity: .3; }
.strip.dead { border-color: var(--hot); } .strip.dead img { filter: grayscale(1) brightness(.6); }
.strip em { margin-left: auto; font: 900 24px Unbounded; font-style: normal; color: var(--dark); background: var(--hot); padding: 4px 12px 6px; border-radius: 8px; }
/* ===== Вариант В: составные элементы, отступы, без кругов; игровые объекты — только иконками ===== */
.hc { position: absolute; left: 60px; top: 220px; }
.hc .pre { display: inline-block; padding: 8px 18px 10px; background: var(--hot); color: #fff; font: 900 30px/1 Unbounded; border-radius: 8px 8px 0 0; }
.hc .main { display: flex; align-items: flex-end; gap: 18px; padding: 16px 26px 20px; background: rgba(2,10,20,.55); border: 3px solid var(--line); border-radius: 0 16px 16px 16px; }
.hc .main b { font: 900 108px/0.95 Unbounded; color: var(--acc); }
.hc .main i { font: 900 60px/1 Unbounded; font-style: normal; opacity: .4; padding-bottom: 6px; }
.hero.c { right: 40px; top: 150px; height: 340px; }
/* маршрут: таблички-причалы на канате, текущая — с вымпелом */
.rope { position: absolute; left: 60px; top: 500px; width: 880px; height: 130px; }
.rope:before { content: ""; position: absolute; left: 0; right: 0; top: 52px; height: 8px; border-radius: 4px;
  background: repeating-linear-gradient(60deg, #c9b48a 0 10px, #8f7a52 10px 20px); }
.pier { position: absolute; top: 24px; width: 128px; margin-left: -64px; }
.pier .pl2 { position: relative; padding: 10px 0 12px; text-align: center; font: 900 30px/1 Unbounded; background: #0d2a47; border: 3px solid var(--line); border-radius: 10px; }
.pier .pl2:before, .pier .pl2:after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 2px; background: rgba(238,246,251,.45); }
.pier .pl2:before { left: 8px; } .pier .pl2:after { right: 8px; }
.pier.past .pl2 { color: var(--acc); border-color: rgba(95,212,196,.5); }
.pier.fut { opacity: .45; }
.pier.cur { top: 4px; width: 156px; margin-left: -78px; }
.pier.cur .pl2 { font-size: 38px; padding: 16px 0 18px; background: var(--ink); color: #0a2340; border: none; box-shadow: 0 8px 0 rgba(2,10,20,.6); }
.pier.cur .pen { position: absolute; left: 50%; top: -58px; width: 6px; height: 62px; background: #c9d3dc; }
.pier.cur .pen:after { content: ""; position: absolute; left: 6px; top: 0; border-left: 46px solid var(--hot); border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
/* главная карточка: внешняя рама + шапка + внутренняя панель + уголки-заклёпки */
.mc { position: absolute; left: 60px; width: 880px; }
.mc .cap { display: flex; align-items: center; gap: 14px; height: 74px; padding: 0 22px; background: var(--acc); color: #0a2340; border-radius: 22px 22px 0 0;
  font: 900 34px/1 Unbounded; text-transform: uppercase; }
.mc .cap .ver { padding: 6px 14px 8px; background: #0a2340; color: var(--ink); border-radius: 8px; }
.mc .cap .kind { margin-left: auto; font-size: 26px; padding: 6px 14px 8px; border: 3px solid #0a2340; border-radius: 8px; }
.mc .body { position: relative; padding: 30px 36px 36px; background: linear-gradient(180deg, #13406a, #0a2340); border: 5px solid var(--acc); border-top: none;
  border-radius: 0 0 22px 22px; box-shadow: 0 14px 0 rgba(2,10,20,.65), 0 0 34px rgba(95,212,196,.3); display: flex; gap: 34px; align-items: center; }
.mc .body:before, .mc .body:after { content: ""; position: absolute; bottom: 14px; width: 12px; height: 12px; border-radius: 3px; background: rgba(238,246,251,.4); }
.mc .body:before { left: 14px; } .mc .body:after { right: 14px; }
.mc .l { flex: 1; min-width: 0; }
.mc .ics { display: flex; align-items: center; gap: 16px; }
.mc .ics .ab { width: 176px; height: 176px; border-radius: 22px; border: 4px solid var(--ink); box-shadow: 0 8px 0 rgba(2,10,20,.6); }
.mc .ics .it { width: 123px; height: 90px; border-radius: 14px; border: 3px solid var(--ink); }
.mc .ics s { font: 900 54px Unbounded; text-decoration: none; }
.mc b.t { display: block; margin-top: 26px; font: 900 54px/1.04 Unbounded; text-transform: uppercase; letter-spacing: -.02em; }
.mc .sub { display: block; margin-top: 14px; font: 800 36px/1.18 Manrope; opacity: .85; }
/* мини-схема: прямоугольная морская карта с сеткой, внутри — настоящие иконки */
.map { position: relative; flex: none; width: 280px; height: 280px; border-radius: 16px; overflow: hidden;
  background: linear-gradient(rgba(238,246,251,.07) 2px, transparent 2px) 0 0 / 50px 50px, linear-gradient(90deg, rgba(238,246,251,.07) 2px, transparent 2px) 0 0 / 50px 50px, #0b2f4d;
  border: 3px solid var(--line); box-shadow: inset 0 0 0 8px rgba(2,10,20,.35); }
.map .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 0 8px; text-align: center; background: rgba(2,10,20,.7); font: 900 22px Unbounded; letter-spacing: .04em; }
.map img { position: absolute; border-radius: 10px; border: 2px solid var(--ink); }
.map .k { width: 70px; height: 70px; border-radius: 12px; border-color: var(--ink); }
.map .tr { width: 52px; height: 52px; box-shadow: 0 0 0 6px rgba(95,212,196,.25); }
.map .ball { position: absolute; width: 12px; height: 12px; border-radius: 3px; background: var(--hot); box-shadow: 0 0 10px var(--hot); }
/* полоски: цветной язычок + номер + название + метка */
.sc { position: absolute; left: 60px; width: 880px; height: 104px; display: flex; align-items: center; gap: 18px; padding: 0 24px 0 0;
  background: rgba(13,42,71,.85); border: 3px solid var(--line); border-radius: 16px; overflow: hidden; font: 900 34px Unbounded; text-transform: uppercase; }
.sc .tab { align-self: stretch; width: 16px; background: var(--acc); }
.sc img { width: 70px; height: 70px; border-radius: 12px; border: 2px solid var(--ink); }
.sc .ver { padding: 5px 12px 7px; background: var(--ink); color: #0a2340; border-radius: 8px; font-size: 28px; }
.sc em { margin-left: auto; font: 900 24px Unbounded; font-style: normal; padding: 5px 12px 7px; border-radius: 8px; border: 3px solid currentColor; }
.sc.past { opacity: .6; } .sc.fut { opacity: .32; }
.sc.dead .tab, .sc .tab.r { background: var(--hot); } .sc.dead { border-color: rgba(255,77,94,.6); } .sc.dead em { color: var(--hot); } .sc.dead img { filter: grayscale(1) brightness(.6); }
/* ===== Вариант Г: новое — без неона (плотные цвета, бумага, жёсткие тени, штампы) ===== */
:root { --paper: #efe6d2; --paper2: #e2d5b8; --navy: #0a2340; --red: #d9443b; }
/* текущий патч: красная пластина на канате + лента «сейчас» с вырезами */
.pier.now { top: 0; width: 150px; margin-left: -75px; }
.pier.now .pl2 { font-size: 36px; padding: 14px 0 16px; background: var(--red); color: var(--paper); border: 4px solid var(--navy); border-radius: 10px;
  box-shadow: 6px 6px 0 var(--navy); }
.pier.now .pl2:before, .pier.now .pl2:after { background: var(--paper); }
.pier.now .rib { position: relative; margin: -4px auto 0; width: 130px; padding: 4px 0 8px; text-align: center; background: var(--paper); color: var(--navy);
  font: 900 20px/1 Unbounded; letter-spacing: .08em; clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%); }
.pier.now .knot { position: absolute; left: 50%; top: -14px; width: 18px; height: 18px; margin-left: -9px; background: #c9b48a; border: 3px solid var(--navy); transform: rotate(45deg); }
/* карточка без схемы: содержимое во всю ширину */
.mc.wide .body { flex-direction: column; align-items: stretch; gap: 0; }
/* «удалили»: красная шапка, иконка гаснет, резиновый штамп */
.mc.del .cap { background: var(--red); color: var(--paper); } .mc.del .cap .ver { background: var(--paper); color: var(--navy); } .mc.del .cap .kind { border-color: var(--paper); }
.mc.del .body { border-color: var(--red); box-shadow: 0 14px 0 rgba(2,10,20,.65); }
.mc.del .ics .ab { filter: grayscale(1) brightness(.55); }
.rstamp { position: absolute; right: 44px; top: 70px; padding: 10px 22px 14px; border: 6px solid var(--red); outline: 3px solid var(--red); outline-offset: 5px;
  color: var(--red); font: 900 52px/1 Unbounded; transform: rotate(-9deg); background: rgba(10,35,64,.6); }
/* «изменили»: бумажная карточка «было | стало» */
.pc { position: absolute; left: 60px; width: 880px; }
.pc .cap { display: flex; align-items: center; gap: 14px; height: 74px; padding: 0 22px; background: var(--navy); color: var(--paper); border: 4px solid var(--paper);
  border-bottom: none; border-radius: 18px 18px 0 0; font: 900 34px/1 Unbounded; text-transform: uppercase; }
.pc .cap .ver { padding: 6px 14px 8px; background: var(--red); color: var(--paper); border-radius: 8px; }
.pc .cap .kind { margin-left: auto; font-size: 26px; padding: 6px 14px 8px; border: 3px solid var(--paper); border-radius: 8px; }
.pc .body { display: grid; grid-template-columns: 1fr 70px 1fr; background: var(--paper); color: var(--navy); border: 4px solid var(--paper);
  border-radius: 0 0 18px 18px; box-shadow: 10px 12px 0 var(--navy); padding: 30px 30px 34px; }
.pc .half { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.pc .half .h { padding: 4px 12px 7px; border-radius: 6px; font: 900 24px/1 Unbounded; letter-spacing: .06em; background: var(--navy); color: var(--paper); }
.pc .half.new .h { background: var(--red); }
.pc .half img { width: 150px; height: 150px; border-radius: 16px; border: 4px solid var(--navy); box-shadow: 6px 6px 0 rgba(10,35,64,.35); }
.pc .half img.it { width: 123px; height: 90px; }
.pc .half b { font: 900 38px/1.05 Unbounded; text-transform: uppercase; letter-spacing: -.02em; }
.pc .half span { font: 800 30px/1.15 Manrope; opacity: .8; }
.pc .half.old img { filter: grayscale(.6); } .pc .half.old b, .pc .half.old span { opacity: .55; }
.pc .arr { align-self: center; justify-self: center; font: 900 60px Unbounded; color: var(--red); }
.paperline { background: repeating-linear-gradient(180deg, transparent 0 42px, rgba(10,35,64,.08) 42px 44px), var(--paper); }

<body>
<div class="bg"></div>
<div class="waves"></div>
<div id="f"></div>
<script>
const f = +new URLSearchParams(location.search).get("f") || 1, R = document.getElementById("f");
const A = "assets/abilities/", I = "_fv_work/";
const head = (a, b, on) => `<div class="head"><span class="${on === 0 ? "on" : "off"}">${a}</span><br>→ <span class="${on === 1 ? "on" : "off"}">${b}</span></div>`;
const hero = (cls = "") => `<img class="hero ${cls}" src="assets/anim/kunkka/001.webp">`;
const card = (top, h, icons, ver, title, sub, tag, cls = "", extra = "", tail = "") =>
  `<div class="card ${cls}" style="top:${top}px;height:${h}px"><div class="ics">${icons}</div><div class="tx"><div class="v">${ver}</div><b>${title}</b><span>${sub}</span>${extra}</div>${tail}<div class="tag">${tag}</div></div>`;
const ab = k => `<img class="ab" src="${A}${k}.png">`, it = k => `<img class="it" src="${I}item_${k}.png">`;
const subs = t => `<div class="subs">${t}</div>`;
if (f === 1) {
  // Маршрут: острова-патчи, кораблик у текущего
  const vs = ["7.23", "7.28", "7.33", "7.36", "7.37", "7.41"], cur = 1;
  const xs = vs.map((_, k) => 46 + k * 157);
  R.innerHTML = `<div class="lab">1 · Маршрут по патчам</div>` + head("7.23", "7.28", 1) + hero() +
    `<div class="route"><svg viewBox="0 0 880 150"><path d="M46 69 ${xs.slice(1).map((x, k) => `Q ${x - 78} ${k % 2 ? 20 : 120} ${x} 69`).join(" ")}" fill="none" stroke="#eef6fb" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".6"/></svg>
     ${vs.map((v, k) => `<div class="isl ${k < cur ? "past" : k === cur ? "cur" : "fut"}" style="left:${xs[k]}px"><i></i><b>${v}</b></div>`).join("")}
     <div class="ship" style="left:${xs[cur] - 80}px">⛵</div></div>` +
    card(720, 330, it("ultimate_scepter") + "<s>→</s>" + ab("kunkka_torrent_storm"), "7.23", "Аганим: Торрент Шторм", "5 секунд торренты в случайных местах", "добавили", "dim") +
    card(1080, 330, it("aghanims_shard") + "<s>→</s>" + ab("kunkka_tidal_wave"), "7.28", "Шард: Тайдал Вейв", "волна тащит врагов за собой", "добавили", "on") +
    subs("у Кунки <i>появился</i> шард");
}
if (f === 2) {
  // Мини-схема в карточке: торренты в случайных местах вокруг Кунки / прицел
  const t = [[60, 70], [190, 60], [40, 170], [200, 190], [120, 220], [175, 120]];
  R.innerHTML = `<div class="lab">2 · Мини-схема в карточке</div>` + head("7.23", "7.28", 0) + hero() +
    card(520, 400, ab("kunkka_torrent_storm"), "7.23", "Торрент Шторм", "торренты в случайных местах", "добавили", "on", "",
      `<div class="scheme"><div class="k"></div>${t.map(([x, y]) => `<div class="t" style="left:${x}px;top:${y}px"></div>`).join("")}</div>`) +
    card(960, 400, ab("kunkka_torrent_storm"), "7.33", "В точку", "торренты бьют в прицел", "изменили", "", "",
      `<div class="scheme"><div class="k" style="left:30%;top:70%"></div><div class="cross" style="left:66%;top:34%"></div>${[[150, 70], [175, 95], [140, 100], [170, 60]].map(([x, y]) => `<div class="t" style="left:${x}px;top:${y}px"></div>`).join("")}</div>`) +
    subs("пять секунд <i>торренты</i> бьют");
}
if (f === 3) {
  // Было → стало цифрами
  R.innerHTML = `<div class="lab">3 · Было → стало цифрами</div>` + head("7.33", "7.36", 0) + hero() +
    card(520, 300, ab("kunkka_torrent_storm"), "7.33", "Торрент Шторм — в точку", "раньше только вокруг себя", "изменили", "dim") +
    card(850, 420, ab("kunkka_torrent_storm"), "7.34e · 7.35", "Порезали", "", "изменили", "on",
      `<div class="nums"><div class="num"><del>5 с</del> → <ins>4 с</ins></div><div class="num"><del>70</del> → <ins>75</ins> КД</div></div><div class="nums"><div class="num"><del>250</del> → <ins>275</ins> маны</div></div>`) +
    subs("а потом <i>порезали</i>");
}
if (f === 4) {
  // Реакция героя на «удалили»
  R.innerHTML = `<div class="lab">4 · Кунка реагирует</div>` + head("7.37", "7.41", 0) + hero("hit") +
    `<div class="shk" style="right:330px;top:230px">!</div><div class="shk" style="right:40px;top:200px;transform:rotate(14deg)">!</div>` +
    card(720, 330, ab("kunkka_torrent_storm"), "7.37", "Торрент Шторм", "удалён из игры", "удалили", "", "", "") +
    subs("Торрент Шторм <i>удалили</i>");
  document.querySelector(".card").style.borderColor = "var(--hot)";
  document.querySelector(".card .ics img").style.filter = "grayscale(1) brightness(.55)";
}

const route = (cur) => { const vs = ["7.23", "7.28", "7.33", "7.36", "7.37", "7.41"], xs = vs.map((_, k) => 60 + k * 152);
  return `<div class="route b"><svg viewBox="0 0 880 170"><path d="M60 80 ${xs.slice(1).map((x, k) => `Q ${x - 76} ${k % 2 ? 20 : 140} ${x} 80`).join(" ")}" fill="none" stroke="#eef6fb" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round" opacity=".6"/></svg>
    ${vs.map((v, k) => `<div class="isl ${k < cur ? "past" : k === cur ? "cur" : "fut"}" style="left:${xs[k]}px;top:50px"><i></i><b>${v}</b></div>`).join("")}
    <div class="ship" style="left:${xs[cur] - 100}px">⛵</div></div>`; };
const strip = (top, icon, ver, title, cls, tag = "") => `<div class="strip ${cls}" style="top:${top}px"><img src="${icon}"><div class="v">${ver}</div>${title}${tag ? `<em>${tag}</em>` : ""}</div>`;
if (f === 5) {
  const t = [[70, 80], [250, 70], [55, 210], [260, 240], [160, 280], [215, 150]];
  R.innerHTML = `<div class="lab">Б · часть 1 (2 изменения)</div>` + `<div class="head b"><span class="on">7.23</span><br>→ <span class="off">7.28</span></div>` + `<img class="hero b" src="assets/anim/kunkka/001.webp">` + route(0) +
    `<div class="big" style="top:770px;height:540px"><div class="l"><div class="v">7.23</div><div class="ics">${it("ultimate_scepter")}<s>→</s>${ab("kunkka_torrent_storm")}</div><b>Аганим: Торрент Шторм</b><span>5 секунд торренты в случайных местах</span></div>
      <div class="scheme"><div class="k"></div>${t.map(([x, y]) => `<div class="t" style="left:${x}px;top:${y}px"></div>`).join("")}</div></div>` +
    strip(1340, A + "kunkka_tidal_wave.png", "7.28", "Шард: Тайдал Вейв", "fut") + subs("торренты <i>бьют</i> в случайных");
}
if (f === 6) {
  R.innerHTML = `<div class="lab">Б · часть 3 (4 изменения)</div>` + `<div class="head b"><span class="on">7.37</span><br>→ <span class="off">7.41</span></div>` + `<img class="hero b" src="assets/anim/kunkka/001.webp">` + route(4) +
    strip(770, A + "kunkka_torrent_storm.png", "7.37", "Торрент Шторм", "past dead", "удалён") +
    `<div class="big" style="top:890px;height:430px"><div class="l"><div class="v">7.37</div><div class="ics">${it("ultimate_scepter")}<s>→</s>${ab("kunkka_ghostship")}</div><b>Аганим: флот</b><span>два корабля с ядрами</span></div>
      <div class="scheme" style="width:300px;height:300px"><div style="position:absolute;left:40px;top:70px;font-size:70px">⛵</div><div style="position:absolute;left:150px;top:160px;font-size:70px">⛵</div>
      ${[[120, 95], [140, 80], [230, 190], [250, 175], [95, 140]].map(([x, y]) => `<div class="t" style="left:${x}px;top:${y}px;width:16px;height:16px;margin:-8px;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e"></div>`).join("")}</div></div>` +
    strip(1350, A + "kunkka_admirals_rum.png", "7.37", "Адмиральский ром", "fut") +
    strip(1460, A + "kunkka_ghostship.png", "7.41", "Ром ×2", "fut") + subs("");
}

const piers = (cur) => { const vs = ["7.23", "7.28", "7.33", "7.36", "7.37", "7.41"];
  return `<div class="rope">${vs.map((v, k) => `<div class="pier ${k < cur ? "past" : k === cur ? "cur" : "fut"}" style="left:${78 + k * 145}px">${k === cur ? '<div class="pen"></div>' : ""}<div class="pl2">${v}</div></div>`).join("")}</div>`; };
const hc = (a, b) => `<div class="hc"><div class="pre">патч</div><div class="main"><b>${a}</b><i>→ ${b}</i></div></div>`;
const sc = (top, icon, ver, title, cls, tag = "") => `<div class="sc ${cls}" style="top:${top}px"><div class="tab"></div><img src="${icon}"><div class="ver">${ver}</div>${title}${tag ? `<em>${tag}</em>` : ""}</div>`;
const mc = (top, ver, kind, icons, title, sub, map) => `<div class="mc" style="top:${top}px"><div class="cap"><span class="ver">${ver}</span>изменение<span class="kind">${kind}</span></div>
  <div class="body"><div class="l"><div class="ics">${icons}</div><b class="t">${title}</b><span class="sub">${sub}</span></div>${map}</div></div>`;
if (f === 7) {
  const pts = [[30, 40], [200, 30], [40, 160], [210, 170], [120, 200], [190, 100]];
  const map = `<div class="map"><img class="k" src="assets/anim/kunkka/001.webp" style="left:115px;top:95px;object-fit:cover;background:#0b2f4d">${pts.map(([x, y]) => `<img class="tr" src="${A}kunkka_torrent.png" style="left:${x}px;top:${y}px">`).join("")}<div class="lbl">ВОКРУГ КУНКИ</div></div>`;
  R.innerHTML = `<div class="lab">В · часть 1</div>` + hc("7.23", "7.28") + `<img class="hero c" src="assets/anim/kunkka/001.webp">` + piers(0) +
    mc(650, "7.23", "добавили", it("ultimate_scepter") + "<s>→</s>" + ab("kunkka_torrent_storm"), "Аганим: Торрент Шторм", "5 секунд торренты в случайных местах", map) +
    sc(1330, A + "kunkka_tidal_wave.png", "7.28", "Шард: Тайдал Вейв", "fut") + subs("торренты <i>бьют</i> в случайных");
}
if (f === 8) {
  const map = `<div class="map"><img class="ab2" src="${A}kunkka_ghostship.png" style="left:24px;top:40px;width:96px;height:96px"><img src="${A}kunkka_ghostship.png" style="left:160px;top:140px;width:96px;height:96px">
    ${[[130, 70], [150, 82], [170, 94], [90, 160], [70, 172]].map(([x, y]) => `<div class="ball" style="left:${x}px;top:${y}px"></div>`).join("")}<div class="lbl">ДВА КОРАБЛЯ</div></div>`;
  R.innerHTML = `<div class="lab">В · часть 3</div>` + hc("7.37", "7.41") + `<img class="hero c" src="assets/anim/kunkka/001.webp">` + piers(4) +
    sc(650, A + "kunkka_torrent_storm.png", "7.37", "Торрент Шторм", "past dead", "удалён") +
    mc(890, "7.37", "добавили", it("ultimate_scepter") + "<s>→</s>" + ab("kunkka_ghostship"), "Аганим: флот", "два корабля с ядрами", map) +
    sc(1330, A + "kunkka_admirals_rum.png", "7.37", "Адмиральский ром", "fut") + subs("");
  document.querySelector(".subs").style.display = "none";
}


const piers2 = (cur) => { const vs = ["7.23", "7.28", "7.33", "7.36", "7.37", "7.41"];
  return `<div class="rope">${vs.map((v, k) => `<div class="pier ${k < cur ? "past" : k === cur ? "now" : "fut"}" style="left:${100 + k * 148}px">${k === cur ? '<div class="knot"></div><div class="pl2">' + v + '</div><div class="rib">СЕЙЧАС</div>' : '<div class="pl2">' + v + "</div>"}</div>`).join("")}</div>`; };
const mcw = (top, ver, kind, icons, title, sub, cls = "", extra = "") => `<div class="mc wide ${cls}" style="top:${top}px"><div class="cap"><span class="ver">${ver}</span>изменение<span class="kind">${kind}</span></div>
  <div class="body"><div class="ics">${icons}</div><b class="t">${title}</b><span class="sub">${sub}</span>${extra}</div></div>`;
if (f === 9) {
  R.innerHTML = `<div class="lab">Г · добавили</div>` + hc("7.23", "7.28") + `<img class="hero c" src="assets/anim/kunkka/001.webp">` + piers2(0) +
    mcw(660, "7.23", "добавили", it("ultimate_scepter") + "<s>→</s>" + ab("kunkka_torrent_storm"), "Аганим: Торрент Шторм", "5 секунд торренты бьют в случайных местах вокруг Кунки") +
    sc(1330, A + "kunkka_tidal_wave.png", "7.28", "Шард: Тайдал Вейв", "fut") + subs("торренты <i>бьют</i> в случайных");
}
if (f === 10) {
  R.innerHTML = `<div class="lab">Г · изменили</div>` + hc("7.33", "7.36") + `<img class="hero c" src="assets/anim/kunkka/001.webp">` + piers2(2) +
    `<div class="pc" style="top:660px"><div class="cap"><span class="ver">7.33</span>изменение<span class="kind">изменили</span></div>
     <div class="body paperline"><div class="half old"><div class="h">БЫЛО</div><img src="${A}kunkka_torrent_storm.png"><b>Вокруг себя</b><span>торренты только вокруг Кунки</span></div>
     <div class="arr">→</div>
     <div class="half new"><div class="h">СТАЛО</div><img src="${A}kunkka_torrent_storm.png"><b>В точку</b><span>кидается направленно</span></div></div></div>` +
    sc(1250, A + "kunkka_tidebringer.png", "7.33", "Тайдбрингер: истощение", "fut") + sc(1378, A + "kunkka_tidebringer.png", "7.36", "Врождённый Тайдбрингер", "fut") + subs("");
  document.querySelector(".subs").style.display = "none";
}
if (f === 11) {
  R.innerHTML = `<div class="lab">Г · удалили</div>` + hc("7.37", "7.41") + `<img class="hero c" src="assets/anim/kunkka/001.webp">` + piers2(4) +
    mcw(660, "7.37", "удалили", ab("kunkka_torrent_storm"), "Торрент Шторм", "удалён из игры насовсем", "del", '<div class="rstamp">УДАЛЁН</div>') +
    sc(1170, A + "kunkka_ghostship.png", "7.37", "Аганим: флот", "fut") + sc(1298, A + "kunkka_admirals_rum.png", "7.37", "Адмиральский ром", "fut") + subs("");
  document.querySelector(".subs").style.display = "none";
}

// Раскладка без наложений: карточки и полоски идут столбиком с зазором 24 px
if (f >= 7) Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r))]).then(() => { let y = null; [...document.querySelectorAll(".mc, .sc, .pc")].sort((a, b) => a.offsetTop - b.offsetTop).forEach(e => { if (y !== null) e.style.top = y + "px"; y = e.offsetTop + e.offsetHeight + 24; }); document.body.dataset.ready = 1; });
</script>
</body></html>
