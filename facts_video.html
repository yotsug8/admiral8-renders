<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
/* Шрифты лежат в репозитории (fonts/), интернет при рендере не нужен */
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-cyrillic-900-normal.woff2) format("woff2"); }
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-cyrillic-800-normal.woff2) format("woff2"); }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 600; src: url(fonts/manrope-cyrillic-600-normal.woff2) format("woff2"); }
@font-face { font-family: Manrope; font-weight: 600; src: url(fonts/manrope-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }

/* Тёмная инфографика: графит, жёлтый акцент, белый текст, жёсткие тени.
   Безопасная зона TikTok: x 60–940, y 150–1560 */
:root { --bg: #15171c; --ink: #f4f4f2; --acc: #ffd23f; --dark: #0d0e12; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; overflow: hidden; color: var(--ink); font-family: Manrope, sans-serif; }
#dots { position: absolute; inset: -40px; background-image: radial-gradient(rgba(255,255,255,.06) 2px, transparent 2.5px); background-size: 36px 36px; }

#progress { position: absolute; left: 60px; width: 880px; top: 168px; height: 8px; display: flex; gap: 10px; }
.pg { flex: 1; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.pg i { display: block; height: 100%; width: 0; background: var(--ink); }
#wm { position: absolute; left: 62px; top: 190px; font: 600 26px Manrope; color: rgba(244,244,242,.35); }

.seg { position: absolute; inset: 0; visibility: hidden; }
.head { position: absolute; left: 60px; width: 880px; top: 245px; font: 900 84px/1.04 Unbounded; text-transform: uppercase; letter-spacing: -.02em; }
.head .ln { display: block; overflow: hidden; padding-bottom: 4px; }
.head .ln span { display: inline-block; }
.y { color: var(--acc); }

.hero { position: absolute; transform-origin: 50% 100%; }
.big { position: absolute; left: 60px; font: 900 170px/1 Unbounded; letter-spacing: -.04em; white-space: nowrap; }
.lab { position: absolute; left: 64px; font: 800 36px/1.22 Manrope; color: var(--ink); }
.pill { position: absolute; left: 60px; padding: 12px 24px; border-radius: 14px; background: var(--ink); color: var(--dark);
  font: 800 32px Manrope; box-shadow: 8px 8px 0 var(--acc); white-space: nowrap; }

/* «Плашка»: жёлтый прямоугольник с жёсткой тенью, герой выходит за край */
.block { position: absolute; border-radius: 28px; background: var(--acc); box-shadow: 16px 16px 0 var(--ink); }
/* «Диагональ»: косая полоса, два героя, траектория хука */
.band { position: absolute; left: -60px; width: 1200px; height: 380px; background: var(--acc); transform-origin: 0 50%; }
svg.path { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
/* «Сетка» */
.grid { position: absolute; left: 60px; width: 880px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.tile { height: 102px; border-radius: 16px; background: var(--ink); display: flex; align-items: center; justify-content: center;
  box-shadow: 6px 6px 0 var(--acc); }
.tile img { width: 104px; height: 76px; object-fit: cover; border-radius: 8px; }

#subs { position: absolute; left: 60px; width: 880px; top: 1468px; display: flex; justify-content: center; text-align: center; font: 800 56px/1.2 Manrope; white-space: nowrap; transform-origin: 50% 50%; }
#subs span { display: inline-block; margin: 0 4px; padding: 2px 12px; border-radius: 12px; }
#subs span.on { background: var(--acc); color: var(--dark); }

.cards { position: absolute; left: 60px; width: 880px; top: 470px; display: flex; gap: 26px; }
.card { flex: 1; height: 700px; border-radius: 28px; position: relative; overflow: hidden; }
.card.c0, .card.c2 { background: var(--acc); color: var(--dark); box-shadow: 12px 12px 0 var(--ink); }
.card.c1 { background: var(--ink); color: var(--dark); box-shadow: 12px 12px 0 var(--acc); }
.card b { position: absolute; left: 22px; top: 12px; font: 900 110px/1 Unbounded; }
.card img { position: absolute; left: 50%; bottom: 0; height: 560px; max-width: none; transform: translateX(-50%); }

/* «Таймер» */
.clock { position: absolute; left: 60px; width: 880px; text-align: center; font: 900 190px/1 Unbounded; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; }
.vs { position: absolute; left: 60px; width: 880px; display: flex; justify-content: space-between; align-items: center; }
.tcard { position: relative; width: 390px; height: 330px; border-radius: 28px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 18px; font: 900 40px Unbounded; color: var(--dark); }
.tcard.a { background: var(--acc); box-shadow: 14px 14px 0 var(--ink); }
.tcard.b { background: var(--ink); box-shadow: 14px 14px 0 var(--acc); }
.tlogo { width: 200px; height: 200px; border-radius: 24px; background: var(--dark); display: flex; align-items: center; justify-content: center; }
.tlogo img { max-width: 160px; max-height: 170px; }
.win { position: absolute; top: -22px; right: -14px; padding: 8px 18px; border-radius: 12px; background: #2fd36b; color: var(--dark);
  font: 800 28px Manrope; transform: rotate(6deg); box-shadow: 5px 5px 0 var(--dark); }
.tcard span { text-align: center; padding: 0 18px; line-height: 1.05; }
.vs i { font: 800 34px Manrope; color: rgba(244,244,242,.6); font-style: normal; }
.row { position: absolute; left: 60px; width: 880px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.row img { width: 92px; height: 68px; object-fit: cover; border-radius: 8px; box-shadow: 4px 4px 0 var(--acc); }
/* «Шкала» */
.gauge { position: absolute; left: 60px; top: 480px; width: 150px; height: 480px; border-radius: 24px; background: rgba(255,255,255,.08);
  overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.12); }
.gauge i { position: absolute; left: 0; right: 0; bottom: 0; background: #ff5a4e; border-radius: 0 0 24px 24px; }
.gauge .mark { position: absolute; left: 0; right: 0; height: 3px; background: var(--ink); opacity: .7; }
.chips { position: absolute; left: 60px; top: 1150px; width: 880px; display: flex; flex-direction: column; gap: 16px; }
.abil { display: inline-flex; gap: 8px; margin-left: 16px; vertical-align: middle; }
.abil img { width: 50px; height: 50px; border-radius: 10px; box-shadow: 4px 4px 0 var(--dark); }
.chip2 { align-self: flex-start; padding: 12px 22px; border-radius: 14px; background: var(--ink); color: var(--dark); font: 800 34px Manrope; box-shadow: 6px 6px 0 var(--acc); }
.note { position: absolute; left: 60px; width: 880px; font: 600 30px Manrope; color: rgba(244,244,242,.55); text-align: center; }

/* Переход: жёлтая шторка с тёмной кромкой */
#wipe { position: absolute; top: 0; left: 0; width: 1500px; height: 1920px; background: var(--acc); transform: translateX(-1600px); }
#wipe:before { content: ""; position: absolute; right: -60px; top: 0; width: 60px; height: 100%; background: var(--dark); }

/* ---------- Массивный стиль: толстые обводки, «наклейки», крупнее мелкий текст ---------- */
.pill { font-size: 38px; padding: 12px 26px; border: 5px solid var(--dark); }
.chip2 { font-size: 36px; padding: 8px 22px; border: 5px solid var(--dark); display: inline-flex; align-items: center; }
.tcard, .card { border: 6px solid var(--dark); }
.tlogo { box-shadow: inset 0 0 0 5px rgba(255,255,255,.14); }
.win { font-size: 32px; border: 4px solid var(--dark); }
.vs i { font-size: 44px; }
.row img { width: 104px; height: 76px; border: 4px solid var(--ink); border-radius: 12px; box-shadow: 6px 6px 0 var(--acc); }
.abil img { width: 56px; height: 56px; border: 3px solid var(--dark); }
.gauge { box-shadow: none; border: 6px solid var(--ink); }
.note { font-size: 32px; }
/* Герои — как наклейки: белая обводка по контуру */
.hero, .card img { filter: drop-shadow(5px 0 0 var(--ink)) drop-shadow(-5px 0 0 var(--ink)) drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 -5px 0 var(--ink)); }
.card img[src*="/item_"] { filter: none; border: 5px solid var(--dark); }
#subs span { text-shadow: 0 5px 0 var(--dark); }
#subs span.on { text-shadow: none; box-shadow: 6px 6px 0 var(--ink); border: 4px solid var(--dark); }
.evlogo { position: absolute; filter: drop-shadow(6px 6px 0 rgba(0,0,0,.5)); }

/* Финальные карточки: картинка + тёмная плашка с цифрой факта */
.card img { bottom: 0; height: 600px; }
.card img.icon { width: 84%; height: auto; bottom: 220px; border-radius: 14px; border: 5px solid var(--dark); box-shadow: 8px 8px 0 var(--dark); filter: none; }
.card img.logo { width: 86%; height: auto; max-height: 340px; object-fit: contain; bottom: 180px; filter: drop-shadow(8px 8px 0 var(--dark)); }
.cstat { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: var(--dark); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-top: 6px solid var(--dark); }
.cstat strong { font: 900 46px/1 Unbounded; color: var(--acc); white-space: nowrap; letter-spacing: -.03em; }
.cstat small { font: 800 26px/1.1 Manrope; color: var(--ink); text-align: center; padding: 0 10px; }
.card b { z-index: 3; left: 16px; top: 16px; padding: 6px 18px 10px; border-radius: 18px; background: var(--dark); color: var(--acc); font-size: 72px; }
/* Фон карточек: косые полосы — карточки не выглядят пустыми */
.card.c0, .card.c2 { background: repeating-linear-gradient(-45deg, var(--acc) 0 26px, #f5c62e 26px 52px); }
.card.c1 { background: repeating-linear-gradient(-45deg, var(--ink) 0 26px, #e4e4e0 26px 52px); }
/* ===== Тема «b»: сетка вместо точек, белая шторка, заголовок с жёлтой чертой ===== */
body.tb #dots { background-image: linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px);
  background-size: 72px 72px; }
body.tb #wipe { background: var(--ink); }
body.tb .head { padding-left: 30px; border-left: 14px solid var(--acc); }
body.tb #subs span.on { background: var(--ink); }
body.tb .pg i { background: var(--acc); }
/* Финал «follow»: крупное «Подпишись», подкол, круглая кнопка «+» с ником */
.fw { position: absolute; left: 60px; width: 880px; text-align: center; font: 900 96px/1 Unbounded; color: var(--acc); text-transform: uppercase; white-space: nowrap;
  letter-spacing: -.03em; top: 640px; }
.fsub { position: absolute; left: 60px; width: 880px; text-align: center; top: 800px; font: 800 46px/1.2 Manrope; color: var(--ink); }
.fbtn { position: absolute; left: 400px; top: 960px; width: 200px; height: 200px; border-radius: 50%; background: #ff5a4e; border: 10px solid var(--ink);
  box-shadow: 12px 12px 0 var(--dark); display: flex; align-items: center; justify-content: center; }
.fbtn svg { width: 110px; height: 110px; }
.fnick { position: absolute; left: 60px; width: 880px; text-align: center; top: 1200px; font: 800 44px Manrope; color: rgba(244,244,242,.75); }
/* Хук-список: три вопроса строками */
.hrow { position: absolute; left: 60px; width: 880px; height: 210px; border-radius: 30px; background: var(--dark); border: 6px solid var(--ink);
  box-shadow: 12px 12px 0 var(--acc); display: flex; align-items: center; gap: 26px; padding: 0 28px; opacity: 0; }
.hrow .ic { width: 170px; height: 150px; border-radius: 22px; background: var(--ink); flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hrow .ic img { width: 150px; }
.hrow .ic img.hico { width: auto; max-width: 166px; max-height: 146px; }
.hrow b { font: 900 46px/1.1 Unbounded; color: var(--ink); text-transform: uppercase; letter-spacing: -.02em; }
.hrow i { position: absolute; left: -22px; top: -26px; width: 64px; height: 64px; border-radius: 50%; background: var(--acc); color: var(--dark);
  font: 900 36px/64px Unbounded; text-align: center; font-style: normal; border: 5px solid var(--dark); }
/* «Досмотр»: подносы с предметами, лента, штампы решений */
.tray { position: absolute; width: 410px; height: 380px; border-radius: 30px; background: #2a2e37; border: 6px solid var(--ink);
  box-shadow: 12px 12px 0 var(--acc); display: flex; flex-direction: column; align-items: center; padding-top: 34px; opacity: 0; }
.tray img { width: 200px; height: 146px; border-radius: 18px; border: 5px solid var(--dark); box-shadow: 8px 8px 0 var(--dark); }
.tray .nm { margin-top: 26px; font: 900 44px/1 Unbounded; color: var(--ink); text-transform: uppercase; }
.tray .why { margin-top: 12px; font: 800 30px/1.15 Manrope; color: rgba(244,244,242,.75); text-align: center; padding: 0 20px; }
.verd { position: absolute; right: -18px; top: 18px; padding: 6px 18px 10px; border-radius: 16px; border: 7px solid; font: 900 34px/1 Unbounded;
  background: var(--dark); white-space: nowrap; opacity: 0; }
.verd.no { color: #ff5a4e; border-color: #ff5a4e; } .verd.ok { color: #2fd36b; border-color: #2fd36b; } .verd.limit { color: var(--acc); border-color: var(--acc); }
.belt { position: absolute; left: 0; width: 1080px; height: 54px; background: repeating-linear-gradient(90deg, #3a3f4a 0 40px, #2a2e37 40px 80px);
  border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink); }
/* «Дом»: крыша и три этажа-квартиры */
/* «Дом»: рисованный SVG-дом (кирпич, черепица, труба с дымом), жильцы в окнах, подписи — облачка справа */
.hw { position: absolute; inset: 0; transform-origin: 315px 1430px; }
.hw svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
.hwin { position: absolute; width: 214px; height: 174px; overflow: hidden; }
.hwin img { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); max-width: 190px; max-height: 168px; }
.bub { position: absolute; left: 600px; width: 340px; padding: 18px 20px 20px; border-radius: 26px; background: var(--ink); color: var(--dark);
  border: 6px solid var(--dark); box-shadow: 10px 10px 0 var(--acc); opacity: 0; }
.bub:before { content: ""; position: absolute; left: -34px; top: 46px; border: 18px solid transparent; border-right: 22px solid var(--dark); }
.bub:after { content: ""; position: absolute; left: -22px; top: 50px; border: 14px solid transparent; border-right: 18px solid var(--ink); }
.bub b { display: inline-block; padding: 4px 14px 8px; border-radius: 12px; font: 900 34px/1 Unbounded; text-transform: uppercase; border: 4px solid var(--dark); }
.bub b.cg { background: #2fd36b; } .bub b.cr { background: #ff5a4e; } .bub b.cy { background: var(--acc); }   /* не .y — это класс жёлтого текста */
.bub div { margin-top: 12px; font: 800 34px/1.15 Manrope; }
.puff { position: absolute; border-radius: 50%; background: rgba(220,220,220,.55); }
/* «Сутки»: циферблат день/ночь, подпись, плитки дней */
.dial { position: absolute; left: 290px; top: 470px; width: 500px; height: 500px; border-radius: 50%; border: 10px solid var(--ink);
  background: conic-gradient(var(--acc) 0 180deg, #24305e 180deg 360deg); box-shadow: 16px 16px 0 var(--dark); }
.dial .hand { position: absolute; left: 50%; top: 50%; width: 14px; height: 210px; margin-left: -7px; border-radius: 7px; background: var(--ink);
  transform-origin: 50% 0; border: 4px solid var(--dark); }
.dial .hub { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; border-radius: 50%; background: var(--dark); border: 6px solid var(--ink); }
.dial .sun, .dial .moon { position: absolute; width: 90px; height: 90px; border-radius: 50%; }
.dial .sun { left: 330px; top: 200px; background: #fff3b0; border: 6px solid var(--dark); }
.dial .moon { left: 60px; top: 200px; background: #f4f4f2; box-shadow: inset -26px 0 0 #24305e; border: 6px solid var(--dark); }
.daylab { position: absolute; left: 60px; width: 880px; text-align: center; font: 900 64px/1.05 Unbounded; color: var(--acc); text-transform: uppercase; opacity: 0; }
.daytile { position: absolute; width: 200px; height: 190px; border-radius: 24px; background: var(--ink); border: 6px solid var(--dark); box-shadow: 8px 8px 0 var(--acc);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 0; color: var(--dark); }
.daytile .sm { display: flex; gap: 10px; }
.daytile .sm u { width: 50px; height: 50px; border-radius: 50%; background: var(--acc); border: 4px solid var(--dark); }
.daytile .sm s { width: 50px; height: 50px; border-radius: 50%; background: #f4f4f2; box-shadow: inset -16px 0 0 #24305e; border: 4px solid var(--dark); }
.daytile b { font: 900 34px/1 Unbounded; }
/* «Zzz» над карточкой команды */
.zzz { position: absolute; font: 900 58px/1 Unbounded; color: var(--acc); -webkit-text-stroke: 5px var(--dark); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--dark); }
/* Подпись на наклейке хука */
.stk .cap { position: absolute; left: 12px; right: 12px; top: 18px; padding: 6px 4px 10px; border-radius: 14px; background: var(--dark); color: var(--acc);
  font: 900 36px/1.1 Unbounded; text-align: center; letter-spacing: -.02em; }
.stk img.logo { height: auto; width: 84%; left: 50%; bottom: 42%; transform: translate(-50%, 50%); object-fit: contain; filter: drop-shadow(6px 6px 0 var(--dark)); }
/* Иконки в плашках — без искажения пропорций (предметы не квадратные) */
.abil img { width: auto; }
/* «Ловушка»: панель скрытых данных, сканер, штамп БАН, логотип и счётчик */
.panel { position: absolute; left: 60px; top: 480px; width: 880px; height: 420px; border-radius: 28px; background: var(--dark);
  border: 6px solid var(--ink); box-shadow: 14px 14px 0 var(--acc); overflow: hidden; padding: 34px 40px; }
.panel .tag { display: inline-block; padding: 6px 18px; border-radius: 10px; background: var(--acc); color: var(--dark); font: 900 30px Unbounded; }
.panel .bar { height: 34px; border-radius: 9px; background: rgba(244,244,242,.16); margin-top: 26px; }
.panel .bar.h { background: repeating-linear-gradient(90deg, rgba(255,210,63,.55) 0 22px, rgba(255,210,63,.15) 22px 34px); }
.scan { position: absolute; left: 0; right: 0; height: 90px; background: linear-gradient(180deg, transparent, rgba(255,90,78,.55), transparent); }
.reader { position: absolute; right: 36px; top: 30px; padding: 8px 20px; border-radius: 12px; background: #ff5a4e; color: var(--dark);
  font: 800 34px Manrope; border: 5px solid var(--dark); }
.stamp { position: absolute; left: 290px; top: 610px; width: 500px; padding: 6px 0 14px; text-align: center; border: 14px solid #ff5a4e; border-radius: 26px;
  color: #ff5a4e; font: 900 150px/1 Unbounded; letter-spacing: -.02em; background: rgba(13,14,18,.82); }
.plate { position: absolute; left: 60px; top: 950px; width: 320px; height: 250px; border-radius: 28px; background: var(--ink); border: 6px solid var(--dark);
  box-shadow: 12px 12px 0 var(--acc); display: flex; align-items: center; justify-content: center; }
.plate img { width: 250px; image-rendering: auto; }
/* «Дальность»: линейка, клик, место приземления, карточка игрока */
.ruler { position: absolute; left: 100px; top: 1052px; width: 840px; height: 14px; border-radius: 7px; background: rgba(244,244,242,.25); }
.ruler i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ink); }
.tick { position: absolute; top: 980px; width: 10px; height: 100px; border-radius: 5px; background: var(--acc); border: 3px solid var(--dark); }
.tlab { position: absolute; top: 1090px; padding: 6px 18px; border-radius: 12px; font: 900 54px Unbounded; border: 5px solid var(--dark); white-space: nowrap; }
.tlab.w { background: var(--ink); color: var(--dark); box-shadow: 6px 6px 0 var(--acc); }
.tlab.r { background: #ff5a4e; color: var(--dark); box-shadow: 6px 6px 0 var(--ink); }
.cursor { position: absolute; top: 1018px; width: 82px; height: 82px; border-radius: 50%; border: 8px solid #ff5a4e; }
.cursor:after { content: ""; position: absolute; left: 25px; top: 25px; width: 16px; height: 16px; border-radius: 50%; background: #ff5a4e; }
.landicon { position: absolute; top: 960px; width: 132px; height: 96px; border-radius: 14px; border: 5px solid var(--dark); box-shadow: 7px 7px 0 var(--ink); }
.gapbar { position: absolute; top: 1048px; height: 22px; border-radius: 6px; background: repeating-linear-gradient(-45deg, #ff5a4e 0 12px, #b8352c 12px 24px); }
.pcard { position: absolute; left: 60px; top: 1200px; width: 880px; height: 200px; border-radius: 28px; background: var(--acc); border: 6px solid var(--dark);
  box-shadow: 12px 12px 0 var(--ink); display: flex; align-items: center; gap: 22px; padding: 0 28px; color: var(--dark); }
.pcard .lg { width: 140px; height: 140px; border-radius: 22px; background: var(--dark); display: flex; align-items: center; justify-content: center; flex: none; }
.pcard .lg img { max-width: 112px; max-height: 112px; }
.pcard b { display: block; font: 900 58px/1 Unbounded; }
.pcard small { display: block; font: 800 34px/1.2 Manrope; margin-top: 8px; }
/* «Патчноут»: номер патча, лист со смайликами, расшифровка */

// ---------- кадр в момент t ----------
function seek(t) {
  const segs = D.segs;
  let i = 0; while (i + 1 < segs.length && segs[i + 1].start <= t) i++;
  const lt = t - segs[i].start;

  const TK = document.body.classList.contains("tk");
  // Сдвиг узора по кругу: в старых темах шаг 36 px совпадает с узором; в теме k фон неподвижен (иначе «скачет»)
  if (!TK) document.getElementById("dots").style.transform = `translate(${(t * 6) % 36}px, ${(t * 4) % 36}px)`;
  const fi = segs.slice(0, i + 1).filter(s => !s.hook && !s.outro).length - 1;   // номер факта
  document.querySelectorAll(".pg i").forEach((bar, k) => {
    bar.style.width = (segs[i].outro || k < fi ? 100 : k === fi && !segs[i].hook ? clamp(lt / segs[i].dur) * 100 : 0) + "%";
  });
  SEGS.forEach((g, k) => { g.el.style.visibility = k === i ? "visible" : "hidden"; });
  draw(SEGS[i], lt);

  // Шторка: заезжает слева, на стыке закрывает экран, уезжает вправо
  let x = -1600;
  segs.forEach((s, k) => {
    if (!k) return;
    const d = t - s.start;
    if (Math.abs(d) < WIPE) x = -1600 + eInOut((d + WIPE) / (2 * WIPE)) * 2800;
  });
  document.getElementById("wipe").style.transform = `translateX(${x}px)`;
  if (TK) {
    document.querySelectorAll("#waves svg").forEach((sv, k) => { sv.style.transform = `translateX(${-((t * (30 + k * 18)) % 360)}px)`; });
    document.getElementById("compass").style.transform = `rotate(${t * 2}deg)`;
    // Переход: волна поднимается снизу, накрывает экран и уходит вверх
    const tide = document.getElementById("tide"), W2 = WIPE * 1.25;
    let st = null;
    segs.forEach((s, k) => { if (k && Math.abs(t - s.start) < W2) st = t - s.start; });
    tide.style.visibility = st === null ? "hidden" : "visible";
    if (st !== null) {
      const e = eInOut((st + W2) / (2 * W2));
      tide.style.transform = `translateY(${1920 - e * (1920 + 2500)}px)`;
      tide.querySelectorAll("svg").forEach(sv => { sv.style.transform = `translateX(${-((t * 300) % 360)}px)`; });
    }
  }
  if (document.body.classList.contains("tc")) {
    document.getElementById("sweep").style.transform = `rotate(${t * 45}deg)`;
    SEGS[i].el.style.transformOrigin = "540px 940px";
    SEGS[i].el.style.transform = `scale(${1 + 0.025 * clamp(lt / segs[i].dur)})`;
    // Переход: мятный круг заливает экран из центра, затем раскрывается дырой
    const ring = document.getElementById("ring"), edge = ring.firstChild, W2 = WIPE * 1.1;
    let st = null;
    segs.forEach((s, k) => { if (k && Math.abs(t - s.start) < W2) st = t - s.start; });
    ring.style.visibility = st === null ? "hidden" : "visible";
    if (st !== null) {
      const e = st < 0 ? eInOut((st + W2) / W2) : eInOut(st / W2), R = e * 1250;
      if (st < 0) { ring.style.clipPath = `circle(${R}px at 540px 940px)`; ring.style.webkitMaskImage = "none"; edge.style.width = edge.style.height = 2 * R + "px"; }
      else { ring.style.clipPath = "none"; ring.style.webkitMaskImage = `radial-gradient(circle at 540px 940px, transparent ${R}px, #000 ${R + 2}px)`;
             edge.style.width = edge.style.height = 2 * (R + 18) + "px"; }
    }
  }
  drawSubs(segs[i].outro ? null : segs[i].words, lt);       // в финале текст уже крупно на экране
}

function draw(g, lt) {
  const P = g.parts, s = g.s;
  if (!P.lines) return;
  const hl = g === SEGS[0] ? lt + 0.7 : lt;        // первый кадр = обложка: заголовок уже на месте
  P.lines.forEach((sp, j) => { const k = eOut((hl - 0.12 - j * 0.09) / 0.45); sp.style.transform = `translateY(${(1 - k) * 110}%)`; });
  if (s.hook && P.badges) {
    if (P.anim) { const e = eBack((lt - 0.1) / 0.6); P.anim.cv.style.opacity = clamp(e * 2); P.anim.cv.style.transform = `translateX(${(1 - e) * -220}px)`; drawAnim(P.anim, lt); }
    const at = s.at || [];
    P.badges.forEach((b, k) => {
      const t0 = at[k] != null ? at[k] : 0.5 + k * 0.7, e = eBack((lt - t0 + 0.05) / 0.45);
      const nxt = at[k + 1] != null ? at[k + 1] : 1e9, hit = clamp(1 - (lt - t0) / 0.3) * (lt >= t0 ? 1 : 0);
      b.style.opacity = clamp(e * 2);
      b.style.transform = `translateX(${(1 - e) * 140}px) scale(${(0.85 + 0.15 * e) * (1 + 0.06 * hit)})`;
      b.classList.toggle("on", lt >= t0 && lt < nxt);
    });
    return;
  }
  if (s.hook && P.rows) {
    P.rows.forEach((r, k) => {
      const t0 = (s.at && s.at[k] != null) ? s.at[k] : 0.4 + k * 0.6, e = eBack((lt - t0 + 0.05) / 0.45);
      r.style.opacity = clamp(e * 2); r.style.transform = `translateY(${(1 - e) * 90}px) rotate(${(k - 1) * 1.2}deg)`;      // всплывают снизу, не вылезая за края
    });
    return;
  }
  if (s.hook) {
    P.stk.forEach((c, k) => {
      const t0 = (s.at && s.at[k] != null) ? s.at[k] : 0.4 + k * 0.5;
      const e = eBack((lt - t0 + 0.05) / 0.45);
      c.style.opacity = clamp(e * 2);
      c.style.transform = `translateY(${(1 - e) * 220}px) rotate(${c.dataset.rot * (0.4 + 0.6 * e) + 0.6 * Math.sin(lt * 2 + k)}deg) scale(${0.85 + 0.15 * e})`;
    });
    return;
  }
  if (s.outro && P.fw) {
    const a = eBack((lt - 0.1) / 0.5); P.fw.style.opacity = clamp(a * 2); P.fw.style.transform = `scale(${0.85 + 0.15 * a})`;
    const b = eOut((lt - 0.7) / 0.4); P.fsub.style.opacity = b; P.fsub.style.transform = `translateY(${(1 - b) * 20}px)`;
    const c = eBack((lt - 1.0) / 0.45); P.fbtn.style.opacity = clamp(c * 2);
    // Одно мягкое «нажатие»: кнопка проседает, плюс сменяется галочкой, кнопка зеленеет
    const tP = 1.9, pr = clamp((lt - tP) / 0.18), up = clamp((lt - tP - 0.18) / 0.25);
    P.fbtn.style.transform = `scale(${(0.8 + 0.2 * c) * (1 - 0.1 * pr + 0.1 * up)})`;
    const done = lt > tP + 0.18;
    P.fbtn.style.background = done ? "#2fd36b" : "#ff5a4e";
    P.fbtn.querySelector(".plus").setAttribute("opacity", done ? 0 : 1); P.fbtn.querySelector(".tick").setAttribute("opacity", done ? 1 : 0);
    P.fnick.style.opacity = clamp((lt - 1.2) / 0.4);
    if (P.anim) { const e = eBack((lt - 0.05) / 0.5); P.anim.cv.style.opacity = clamp(e * 2); P.anim.cv.style.transform = `translateY(${(1 - e) * 80}px)`; drawAnim(P.anim, lt); }
    return;
  }
  if (s.outro) {
    P.cards.forEach((c, k) => { const e = eBack((lt - 0.3 - k * 0.12) / 0.5); c.style.transform = `translateY(${(1 - e) * 260}px) rotate(${(1 - e) * (k - 1) * 8}deg)`; c.style.opacity = clamp(e * 2); });
    const e = eOut((lt - 0.9) / 0.4); P.cta.style.opacity = e; P.cta.style.transform = `translateY(${(1 - e) * 30}px)`;
    return;
  }
  if (s.layout === "duo") {
    P.band.style.transform = `rotate(-7deg) scaleX(${eOut((lt - 0.2) / 0.5)})`;
    P.heroes.forEach((im, j) => {
      const e = eBack((lt - 0.35 - j * 0.15) / 0.55);
      im.style.transform = `translateX(${(1 - e) * (j ? 300 : -300)}px) scale(${(0.8 + 0.2 * e) * (1 + 0.02 * Math.sin(lt * 1.6 + j))})`;
      im.style.opacity = clamp(e * 2);
    });
    // Траектория хука проявляется слева направо, пунктир «бежит»
    const e = eOut((lt - cueAt(s.visual, "hook", 1.1)) / 0.8);
    P.hookSvg.style.clipPath = `inset(0 ${1080 - (300 + 520 * e)}px 0 0)`;
    P.hookSvg.style.opacity = e > 0 ? 1 : 0;
    P.hookSvg.querySelector("path:not([d^='M0'])").style.strokeDashoffset = -lt * 40;
    const ep = eBack((lt - cueAt(s.visual, "pill", 1.4)) / 0.4);
    P.pill.style.transform = `translateY(${(1 - ep) * 40}px) rotate(${(1 - ep) * -4}deg)`; P.pill.style.opacity = clamp(ep * 2);
  }
  if (s.layout === "block") {
    const kb = eBack((lt - 0.2) / 0.5);
    P.block.style.transform = `scale(${kb}) rotate(${(1 - kb) * -6}deg)`;
    const kh = eBack((lt - 0.45) / 0.55);
    P.hero.style.transform = `translateY(${(1 - kh) * 200}px) scale(${(0.9 + 0.1 * kh) * (1 + 0.004 * lt)})`;
    P.hero.style.opacity = clamp(kh * 2);
    countUp(P.big, s.visual.number, lt, cueAt(s.visual, "number", 0.9));
    const kl = eOut((lt - cueAt(s.visual, "label", 1.3)) / 0.4); P.lab.style.opacity = kl; P.lab.style.transform = `translateY(${(1 - kl) * 20}px)`;
  }
  drawExtra(g, lt);
  if (s.layout === "grid") {
    countUp(P.big, s.visual.number, lt, 0.4);
    const n = P.tiles.length, t0 = cueAt(s.visual, "icons", 0.9), step = Math.min(0.11, (s.dur - 3.5) / n);
    P.tiles.forEach((tl, m) => {
      const e = eBack((lt - t0 - m * step) / 0.3);
      tl.style.transform = `scale(${e}) rotate(${(1 - e) * (m % 2 ? 14 : -14)}deg)`; tl.style.opacity = clamp(e * 2);
    });
    if (P.hero) { const kh = eBack((lt - t0 - n * step) / 0.5); P.hero.style.transform = `translateY(${(1 - kh) * 160}px)`; P.hero.style.opacity = clamp(kh * 2); }
    const kl = eOut((lt - cueAt(s.visual, "label", t0 + 0.2 + n * step)) / 0.4); P.lab.style.opacity = kl; P.lab.style.transform = `translateX(${(1 - kl) * 40}px)`;
  }

// Мозаика: вписываем героя в холст, подбираем размер клетки, чтобы клеток внутри силуэта было ровно target
async function buildMosaic(g) {
  const P = g.parts, target = g.s.visual.icons.count, W = P.cv.width, H = P.cv.height;
  if (!P.hero.complete) await new Promise(r => P.hero.onload = r);
  if (!P.icon.complete) await new Promise(r => P.icon.onload = r);
  const k = Math.min(W / P.hero.naturalWidth, H / P.hero.naturalHeight);
  const w = P.hero.naturalWidth * k, h = P.hero.naturalHeight * k, x0 = (W - w) / 2, y0 = H - h;
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const c = off.getContext("2d"); c.drawImage(P.hero, x0, y0, w, h);
  const A = c.getImageData(0, 0, W, H).data;
  const cells = cell => { const pts = [];
    for (let y = cell / 2; y < H; y += cell) for (let x = cell / 2; x < W; x += cell)
      if (A[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 120) pts.push([x, y]);
    return pts; };
  // Бинарный поиск размера клетки под нужное число Танго
  let lo = 1, hi = 60, pts = [];
  for (let it = 0; it < 30; it++) { const mid = (lo + hi) / 2; pts = cells(mid); if (pts.length > target) lo = mid; else hi = mid; }
  pts = cells(lo); P.cell = lo;
  pts.sort((a, b) => (b[1] - a[1]) || (a[0] - b[0]));     // снизу вверх
  P.pts = pts.slice(0, target);
  let sx = 0, sy = 0; P.pts.forEach(([x, y]) => { sx += x; sy += y; });
  P.lensAt = [sx / P.pts.length, sy / P.pts.length + 40];
  P.lensPos = [Math.min(750, P.lensAt[0] + 230), Math.max(160, P.lensAt[1] - 170)];
  P.silhouette = off;
  P.ctx = P.cv.getContext("2d");
}

// Момент, когда диктор произносит слово-метку (cues в выпуске), иначе запасное время
const cueAt = (v, key, def) => (v && v.at && v.at[key] != null ? v.at[key] : def);

function drawExtra(g, lt) {
  const P = g.parts, s = g.s, v = s.visual, C = (k, d) => cueAt(v, k, d);
  if (s.layout === "timer") {
    const tEnd = C("clock_done", 2.5), e = eOut((lt - 0.3) / Math.max(0.8, tEnd - 0.3)), sec = Math.round(v.timer * e);
    // Меньше часа — минуты:секунды, иначе часы:минуты:секунды
    P.clock.textContent = v.timer < 3600 ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`
      : `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    P.clock.style.color = e >= 1 ? "var(--acc)" : "var(--ink)";
    P.clock.style.transform = `scale(${1 + (e >= 1 ? 0.06 * Math.max(0, 1 - (lt - tEnd) / 0.3) : 0)})`;
    const tT = C("teams", 0.8);
    P.teams.forEach((t, k) => { const q = eBack((lt - tT - k * 0.15) / 0.45); t.style.transform = `translateX(${(1 - q) * (k ? 200 : -200)}px)`; t.style.opacity = clamp(q * 2); });
    P.vs.querySelectorAll("i").forEach(i => i.style.opacity = clamp((lt - tT - 0.3) / 0.3));

    // Счётчик идёт ровно по числу выложенных Танго
    P.big.style.opacity = clamp((lt - 0.6) / 0.3);
    P.big.textContent = String(shown).replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009") + " Танго";
    const p2 = eBack((lt - C("pill", tFe + 0.4)) / 0.4); P.pill.style.opacity = clamp(p2 * 2); P.pill.style.transform = `translateX(-50%) scale(${0.8 + 0.2 * p2})`;
    P.note.style.opacity = clamp((lt - C("note", tFe + 0.8)) / 0.4);
  }
}

// Число набегает от нуля; запятая, % и слова после числа сохраняются
function countUp(el, text, lt, t0) {
  const m = text.match(/^(\d+)(?:,(\d+))?(.*)$/);
  const e = eOut((lt - t0) / 1.0);
  el.style.opacity = clamp((lt - t0) / 0.2);
  el.style.transform = `translateY(${(1 - eBack((lt - t0) / 0.5)) * 40}px)`;
  if (!m) { el.textContent = text; return; }
  const dec = m[2] ? m[2].length : 0;
  const fmt = x => { const [a, b] = x.split("."); return a.replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009") + (b ? "," + b : ""); };
  el.textContent = fmt(e >= 1 ? m[1] + (dec ? "." + m[2] : "") :
    (parseFloat(m[1] + (dec ? "." + m[2] : "")) * e).toFixed(dec)) + m[3];
}

// Субтитры: до 3 слов, новая группа на паузе; одно активное слово на жёлтой плашке
function drawSubs(words, lt) {
  const box = document.getElementById("subs");
  if (!words || !words.length) { box.innerHTML = ""; return; }
  const groups = []; let cur = [];
  words.forEach(w => { if (cur.length && (cur.length >= 3 || w[1] - cur[cur.length - 1][2] > 0.2)) { groups.push(cur); cur = []; } cur.push(w); });
  if (cur.length) groups.push(cur);
  let g = null; groups.forEach(gr => { if (gr[0][1] - 0.05 <= lt) g = gr; });
  if (!g || lt > g[g.length - 1][2] + 0.6) { box.innerHTML = ""; return; }
  box.innerHTML = `<div id="subsin" style="display:inline-block">` + g.map((w, j) => {
    const nxt = j + 1 < g.length ? g[j + 1][1] : w[2] + 0.3;
    return `<span class="${w[1] <= lt && lt < nxt ? "on" : ""}">${w[0]}</span>`;
  }).join("") + `</div>`;
  const inner = document.getElementById("subsin");
  const fit = Math.min(1, 720 / inner.offsetWidth);       // длинная строка ужимается в поля
  const k = eOut((lt - g[0][1] + 0.05) / 0.18);       // без перелёта, чтобы не вылезать за края
  box.style.transform = `scale(${fit * (0.88 + 0.12 * k)})`;
}

// Проверка раскладки: выход за безопасную зону и наложение текстов
function audit() {
  const bad = [];
  const seg = SEGS.find(g => g.el.style.visibility === "visible");
  if (!seg) return bad;
  const R = e => e.getBoundingClientRect();
  const vis = e => +getComputedStyle(e).opacity > 0.95;
  const items = [...seg.el.querySelectorAll(".head .ln, .big, .lab, .pill, .card, .stk, .tile, .clock, .tcard, .chip2, .note, .panel, .plate, .pcard, .ver, .paper, .decode, .tlab, .tray, .bub, .dial, .daytile, .daylab, .hrow, .fw, .fsub, .fbtn, .fnick, .hbadge, .pchip, .slot, .sline, .tree, .agh, .sea, .pl"), ...document.querySelectorAll("#subs span")];
  items.filter(vis).forEach(e => {
    const r = R(e);
    if (r.width && (r.left < 40 || r.right > 960 || r.top < 140 || r.bottom > 1580))
      bad.push(`за зоной: «${e.textContent.trim().slice(0, 20)}» [${r.left | 0},${r.top | 0},${r.right | 0},${r.bottom | 0}]`);
  });
  const texts = [...seg.el.querySelectorAll(".head .ln > span, .big, .lab, .pill, .clock, .vs, .chip2, .note, .evlogo, .pcard, .decode, .tlab, .ver, .daylab, .hrow, .bub, .hbadge, .pchip, .sline, .slot, .agh, .pl .tx, .cnt")].filter(vis);
  // Субтитры: прямоугольник по видимым словам
  const sw = [...document.querySelectorAll("#subs span")].filter(e => e.textContent.trim());
  if (sw.length) { const rs = sw.map(R); texts.push({ textContent: "субтитры", getBoundingClientRect: () => ({
    left: Math.min(...rs.map(r => r.left)), right: Math.max(...rs.map(r => r.right)), top: Math.min(...rs.map(r => r.top)), bottom: Math.max(...rs.map(r => r.bottom)) }) }); }
  for (let a = 0; a < texts.length; a++) for (let b = a + 1; b < texts.length; b++) {
    const A = R(texts[a]), B = R(texts[b]);
    if (A.left < B.right && B.left < A.right && A.top < B.bottom - 4 && B.top < A.bottom - 4)
      bad.push(`наложение: «${texts[a].textContent.trim().slice(0, 16)}» и «${texts[b].textContent.trim().slice(0, 16)}»`);
  }
  // Надписи не должны лежать поверх героев
  seg.el.querySelectorAll("img.hero").forEach(im => {
    if (!vis(im)) return;
    const r = R(im);
    texts.forEach(t => { const A = t.getBoundingClientRect();
      if (A.left < r.right - 10 && r.left + 10 < A.right && A.top < r.bottom - 10 && r.top + 10 < A.bottom)
        bad.push(`надпись на герое: «${t.textContent.trim().slice(0, 16)}»`); });
  });
  // Герои не должны залезать на заголовок
  const head = seg.el.querySelector(".head");
  if (head) {
    const H = R(head);
    seg.el.querySelectorAll("img.hero").forEach(im => {
      if (!vis(im)) return;
      const r = R(im);
      if (r.top < H.bottom - 6 && r.left < H.right && H.left < r.right) bad.push(`герой залезает на заголовок: верх ${r.top | 0}, заголовок до ${H.bottom | 0}`);
    });
  }
  return bad;
}
