<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-cyrillic-900-normal.woff2) format("woff2"); }
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-cyrillic-800-normal.woff2) format("woff2"); }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
/* Обложка TikTok 1080×1920. В сетке профиля видна середина ~1080×1440 (y 240–1680) — всё важное там */
:root { --bg: #15171c; --ink: #f4f4f2; --acc: #ffd23f; --dark: #0d0e12; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px); background-size: 36px 36px; }
.band { position: absolute; left: -80px; top: 760px; width: 1260px; height: 420px; background: var(--acc); transform: rotate(-8deg);
  border-top: 8px solid var(--dark); border-bottom: 8px solid var(--dark); }
.head { position: absolute; left: 60px; top: 250px; width: 980px; font: 900 86px/1.06 Unbounded; white-space: nowrap; color: var(--ink);
  text-transform: uppercase; letter-spacing: -.03em; }
.head .y { color: var(--acc); }
/* Рики — наклейка с белым контуром; рамка задаётся из скрипта по пропорциям */
.hero { position: absolute;
  filter: drop-shadow(7px 0 0 var(--ink)) drop-shadow(-7px 0 0 var(--ink)) drop-shadow(0 7px 0 var(--ink)) drop-shadow(0 -7px 0 var(--ink))
          drop-shadow(14px 16px 0 var(--dark)); }
.gem { position: absolute; width: 130px; height: 95px; border-radius: 16px; border: 5px solid var(--dark); box-shadow: 7px 7px 0 var(--ink); }
.num { position: absolute; left: 50%; top: 1290px; transform: translateX(-50%) rotate(-3deg); padding: 10px 42px 22px; border-radius: 32px;
  background: var(--acc); border: 8px solid var(--dark); box-shadow: 16px 16px 0 var(--ink); white-space: nowrap;
  font: 900 120px/1 Unbounded; color: var(--dark); letter-spacing: -.05em; }
.num small { font-size: 54px; letter-spacing: -.02em; }
.wm { position: absolute; left: 62px; top: 1560px; font: 800 30px Manrope; color: rgba(244,244,242,.45); }
</style>
</head>
<body>
<div class="dots"></div>
<div class="band"></div>
<img class="hero" id="hero" src="_fv_work/hero_riki.png">
<!-- Гемы истины вокруг: ловушка «видит» читеров -->
<img class="gem" src="_fv_work/item_gem.png" style="left:70px;top:1010px;transform:rotate(-14deg)">
<img class="gem" src="_fv_work/item_gem.png" style="left:850px;top:600px;transform:rotate(12deg)">
<img class="gem" src="_fv_work/item_gem.png" style="left:880px;top:1090px;transform:rotate(-8deg)">
<img class="gem" src="_fv_work/item_gem.png" style="left:60px;top:560px;transform:rotate(9deg)">
<div class="head">Как Valve<br>поймали<br><span class="y">читеров?</span></div>
<div class="num">40 000 <small>БАНОВ</small></div>
<div class="wm">@admiral8dota</div>
<script>
// Герой вписывается в рамку 900×700 низом на плашку, по центру
const im = document.getElementById("hero");
im.onload = () => {
  const k = Math.min(900 / im.naturalWidth, 700 / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  im.style.width = w + "px"; im.style.left = (540 - w / 2) + "px"; im.style.top = (1300 - h) + "px";
};
</script>
</body>
</html>
