# Рендер всех выпусков из episodes/*.json в облаке GitHub
name: render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      takes:
        description: "выпуск для дублей озвучки (пусто — обычный рендер)"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        if: ${{ inputs.takes == '' || inputs.takes == null }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core fonts-dejavu-extra
          pip install pillow numpy edge-tts "rembg[cpu]" playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Дубли озвучки
        if: ${{ inputs.takes != '' && inputs.takes != null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          pip install -q pillow numpy
          python facts_video.py --takes "${{ inputs.takes }}" out 2>&1 | tee out/render.log
      - name: Рендер
        if: ${{ inputs.takes == '' || inputs.takes == null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          for f in episodes/*.json; do
            n=$(basename "$f" .json)
            echo "== выпуск $n"
            python quiz.py "$f" "out/guess_build_$n.mp4" 2>&1 | tee -a out/render.log
          done
          for f in episodes_fv/*.json; do
            n=$(basename "$f" .json)
            echo "== Факты $n" | tee -a out/render.log
            python facts_video.py "$f" "out/facts_$n.mp4" 2>&1 | grep -v "кадр " | tee -a out/render.log
          done
          echo "иконок в кэше: $(ls cache | wc -l)" | tee -a out/render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: out/*.mp4
          retention-days: 30
      # Готовые ролики кладём в ветку renders: оттуда их удобно скачать и смотреть на GitHub
      - name: Публикация в ветку renders
        if: always()          # лог публикуется и при ошибке — чтобы было видно причину
        run: |
          BR=renders; [ -n "${{ inputs.takes }}" ] && BR=takes
          cd out
          # Страница-папка: список роликов со ссылками на скачивание
          {
            echo "# Ролики Admiral 8"
            echo
            echo "Нажми на ссылку, чтобы скачать. Обновлено: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
            echo
            for f in $(ls -r *.mp4 *.mp3 2>/dev/null); do
              echo "- [$f](https://github.com/${{ github.repository }}/raw/$BR/$f)"
            done
          } > README.md
          git init -q -b renders
          git add -A
          git -c user.name="render-bot" -c user.email="render-bot@users.noreply.github.com" commit -q -m "Рендер ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BR
