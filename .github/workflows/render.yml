# Рендер выпуска в облаке GitHub (или дубли озвучки / прослушка голосов по кнопке).
# Быстро: рендерится только изменённый выпуск, кадры — в 4 потока, зависимости, картинки и озвучка из кэша.
name: render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      takes:
        description: "выпуск для дублей озвучки (пусто — обычный рендер)"
        default: ""
      voices:
        description: "подбор голоса: list или id через запятую"
        default: ""
      vtext:
        description: "фраза для прослушки голосов (пусто — стандартная)"
        default: ""
      ep:
        description: "номер выпуска для рендера, например 005 (пусто — изменённые в последнем коммите)"
        default: ""
      silent:
        description: "1 — без озвучки (тишина, тайминги по темпу речи)"
        default: ""
      audition:
        description: "прослушка на видео: id:Название,… (нужен ep) — хук и первый факт каждым голосом"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2                 # чтобы видеть, какие выпуски изменились в коммите
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Кэш пакетов, браузера и модели распознавания: повторные запуски без скачивания
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: render-deps-v2
      # Кэш выпусков: справочники, картинки CDN, озвучка Fish и распознавание дублей — перерендер не делает их заново
      - uses: actions/cache@v4
        with:
          path: cache
          key: render-cache-${{ github.run_id }}
          restore-keys: render-cache-
      - name: Какие выпуски рендерить
        id: eps
        if: ${{ (inputs.takes == '' || inputs.takes == null) && (inputs.voices == '' || inputs.voices == null) }}
        run: |
          if [ -n "${{ inputs.ep }}" ]; then E="${{ inputs.ep }}"
          else E=$(git diff --name-only HEAD~1 HEAD | grep -oE '(episodes/|voice/)[0-9]{3}' | grep -oE '[0-9]{3}' | sort -u | tr '\n' ' '); fi
          echo "list=$E" >> "$GITHUB_OUTPUT"; echo "выпуски: ${E:-нет}"
      - name: Зависимости
        if: ${{ steps.eps.outputs.list != '' }}
        run: |
          pip install -q pillow numpy edge-tts playwright faster-whisper imageio-ffmpeg
          python -m playwright install chromium
      - name: Подбор голоса
        if: ${{ inputs.voices != '' && inputs.voices != null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FV_VOICE_TEXT: ${{ inputs.vtext }}
        run: |
          set -o pipefail
          mkdir -p out
          pip install -q pillow numpy
          python video.py --voices "${{ inputs.voices }}" out 2>&1 | tee out/render.log
      - name: Дубли озвучки
        if: ${{ inputs.takes != '' && inputs.takes != null }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q pillow numpy faster-whisper
          FV_TAKES_ANALYZE=1 python video.py --takes "${{ inputs.takes }}" out 2>&1 | tee out/render.log
      - name: Рендер
        if: ${{ steps.eps.outputs.list != '' }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          T0=$(date +%s)
          if [ -n "${{ inputs.audition }}" ]; then
            FV_WORKERS=4 python video.py --audition "episodes/${{ inputs.ep }}.json" "${{ inputs.audition }}" out 2>&1 | tee -a out/render.log
            echo "рендер занял $(( $(date +%s) - T0 )) с" | tee -a out/render.log; exit 0
          fi
          for n in ${{ steps.eps.outputs.list }}; do
            echo "== Выпуск $n" | tee -a out/render.log
            FV_WORKERS=4 FV_SILENT="${{ inputs.silent }}" python video.py "episodes/$n.json" "out/$n.mp4" 2>&1 | tee -a out/render.log
          done
          echo "рендер занял $(( $(date +%s) - T0 )) с" | tee -a out/render.log
      # Готовые ролики кладём в ветку renders: оттуда их удобно скачать и смотреть на GitHub
      - name: Публикация в ветку renders
        if: always()          # лог публикуется и при ошибке — чтобы было видно причину
        run: |
          BR=renders; [ -n "${{ inputs.takes }}${{ inputs.voices }}" ] && BR=takes
          [ -z "$(ls out)" ] && exit 0
          if [ "$BR" = renders ]; then          # прошлые ролики сохраняем: берём ветку и докладываем новые файлы
            git clone -q --depth 1 -b renders "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" prev || mkdir prev
            rm -rf prev/.git; cp -n prev/*.mp4 prev/cover_*.png out/ 2>/dev/null || true
          fi
          cd out
          # Страница-папка: список роликов со ссылками на скачивание
          {
            echo "# Ролики Admiral 8"
            echo
            echo "Нажми на ссылку, чтобы скачать. Обновлено: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
            echo
            for f in $(ls -r *.mp4 *.mp3 cover_*.png 2>/dev/null); do
              echo "- [$f](https://github.com/${{ github.repository }}/raw/$BR/$f)"
            done
          } > README.md
          git init -q -b renders
          git add -A
          git -c user.name="render-bot" -c user.email="render-bot@users.noreply.github.com" commit -q -m "Рендер ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:$BR
