<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-cyrillic-900-normal.woff2) format("woff2"); }
@font-face { font-family: Unbounded; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-cyrillic-800-normal.woff2) format("woff2"); }
@font-face { font-family: Manrope; font-weight: 800; src: url(fonts/manrope-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
/* Обложка TikTok 1080×1920, всё важное в середине (y 240–1680).
   Компоновка «досмотр»: сетка как в выпуске, рамка рентгена, предметы и штампы решений */
:root { --bg: #15171c; --ink: #f4f4f2; --acc: #ffd23f; --dark: #0d0e12; --red: #ff5a4e; --green: #2fd36b; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px),
  linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px); background-size: 72px 72px; }
.head { position: absolute; left: 60px; top: 260px; width: 960px; padding-left: 30px; border-left: 16px solid var(--acc);
  font: 900 92px/1.04 Unbounded; color: var(--ink); text-transform: uppercase; letter-spacing: -.03em; }
.head .y { color: var(--acc); }
/* Рамка рентгена */
.scan { position: absolute; left: 60px; top: 560px; width: 960px; height: 780px; border-radius: 40px; background: #20242c;
  border: 10px solid var(--ink); box-shadow: 18px 18px 0 var(--acc); overflow: hidden; }
.scan:after { content: ""; position: absolute; left: 0; right: 0; top: 330px; height: 120px;
  background: linear-gradient(180deg, transparent, rgba(255,90,78,.45), transparent); }
.big { position: absolute; left: 120px; top: 640px; width: 520px; height: 380px; border-radius: 34px; border: 10px solid var(--dark);
  box-shadow: 14px 14px 0 var(--dark); transform: rotate(-6deg); }
.small { position: absolute; width: 220px; height: 160px; border-radius: 22px; border: 7px solid var(--dark); box-shadow: 10px 10px 0 var(--dark); }
.stamp { position: absolute; padding: 6px 26px 14px; border-radius: 22px; border: 12px solid; background: var(--dark); font: 900 78px/1 Unbounded; }
.stamp.no { color: var(--red); border-color: var(--red); }
.stamp.ok { color: var(--green); border-color: var(--green); font-size: 50px; border-width: 8px; }
.stamp.lim { color: var(--acc); border-color: var(--acc); font-size: 48px; border-width: 8px; }
.belt { position: absolute; left: 0; top: 1380px; width: 1080px; height: 70px; background: repeating-linear-gradient(90deg, #3a3f4a 0 50px, #2a2e37 50px 100px);
  border-top: 8px solid var(--ink); border-bottom: 8px solid var(--ink); }
.wm { position: absolute; left: 62px; top: 1500px; font: 800 30px Manrope; color: rgba(244,244,242,.45); }
</style>
</head>
<body>
<div class="grid"></div>
<div class="head">С чем пустят<br>в <span class="y">самолёт?</span></div>
<div class="scan"></div>
<img class="big" src="_fv_work/item_rapier.png">
<div class="stamp no" style="left:150px;top:1060px;transform:rotate(-8deg)">НЕЛЬЗЯ</div>
<img class="small" src="_fv_work/item_cheese.png" style="left:720px;top:620px;transform:rotate(7deg)">
<div class="stamp ok" style="left:705px;top:810px;transform:rotate(6deg)">МОЖНО</div>
<img class="small" src="_fv_work/item_bottle.png" style="left:720px;top:990px;transform:rotate(-5deg)">
<div class="stamp lim" style="left:660px;top:1180px;transform:rotate(4deg)">≤100 МЛ</div>
<div class="belt"></div>
<div class="wm">@admiral8dota</div>
</body>
</html>
