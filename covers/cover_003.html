<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Unbounded; font-weight: 900; src: url(../fonts/unbounded-cyrillic-900-normal.woff2) format("woff2"); }
@font-face { font-family: Unbounded; font-weight: 900; src: url(../fonts/unbounded-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: Manrope; font-weight: 800; src: url(../fonts/manrope-cyrillic-800-normal.woff2) format("woff2"); }
@font-face { font-family: Manrope; font-weight: 800; src: url(../fonts/manrope-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
/* Обложка TikTok 1080×1920. В сетке профиля видна середина ~1080×1440 (y 240–1680) — всё важное там.
   Компоновка «матч»: логотип уснувшей команды, соперник, плашка-таймер и штамп GG */
:root { --bg: #15171c; --ink: #f4f4f2; --acc: #ffd23f; --dark: #0d0e12; --red: #ff5a4e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px); background-size: 36px 36px; }
/* Круг-«прожектор» за логотипом */
.spot { position: absolute; left: 70px; top: 520px; width: 640px; height: 640px; border-radius: 50%; background: var(--acc);
  border: 10px solid var(--dark); box-shadow: 18px 18px 0 var(--ink); }
.head { position: absolute; left: 60px; top: 250px; width: 960px; font: 900 92px/1.04 Unbounded; color: var(--ink);
  text-transform: uppercase; letter-spacing: -.03em; }
.head .y { color: var(--acc); }
/* Логотип — наклейка с белым контуром */
.logo { position: absolute;
  filter: drop-shadow(7px 0 0 var(--ink)) drop-shadow(-7px 0 0 var(--ink)) drop-shadow(0 7px 0 var(--ink)) drop-shadow(0 -7px 0 var(--ink))
          drop-shadow(14px 16px 0 var(--dark)); }
.zzz { position: absolute; font-family: Unbounded; font-weight: 900; color: var(--ink); -webkit-text-stroke: 7px var(--dark); paint-order: stroke fill;
  text-shadow: 8px 8px 0 var(--dark); }
.vs { position: absolute; left: 760px; top: 640px; font: 900 60px Unbounded; color: rgba(244,244,242,.6); }
.opp { position: absolute; left: 720px; top: 740px; width: 280px; height: 300px; border-radius: 30px; background: var(--ink); border: 8px solid var(--dark);
  box-shadow: 14px 14px 0 var(--acc); display: flex; align-items: center; justify-content: center; transform: rotate(5deg); }
.opp img { max-width: 190px; max-height: 230px; }
.win { position: absolute; right: -24px; top: -30px; padding: 8px 18px; border-radius: 14px; background: #2fd36b; color: var(--dark);
  border: 5px solid var(--dark); font: 800 36px Manrope; transform: rotate(8deg); }
/* Плашка-таймер с главной цифрой */
.num { position: absolute; left: 60px; top: 1210px; width: 960px; padding: 18px 0 26px; border-radius: 36px; background: var(--dark);
  border: 8px solid var(--ink); box-shadow: 16px 16px 0 var(--acc); text-align: center; white-space: nowrap; }
.num b { font: 900 200px/1 Unbounded; color: var(--acc); letter-spacing: -.04em; }
.num small { display: block; margin-top: 6px; font: 800 44px Manrope; color: var(--ink); }
.stamp { position: absolute; left: 770px; top: 1075px; padding: 4px 30px 12px; border: 12px solid var(--red); border-radius: 24px; color: var(--red);
  font: 900 92px/1 Unbounded; background: var(--bg); transform: rotate(12deg); }
.wm { position: absolute; left: 62px; top: 1580px; font: 800 30px Manrope; color: rgba(244,244,242,.45); }
</style>
</head>
<body>
<div class="dots"></div>
<div class="head">Уснул прямо<br><span class="y">на турнире?</span></div>
<div class="spot"></div>
<img class="logo" id="logo" src="../assets/teams/mosquito_clan.png">
<div class="zzz" style="left:560px;top:560px;font-size:110px">Z</div>
<div class="zzz" style="left:650px;top:470px;font-size:80px">z</div>
<div class="vs">vs</div>
<div class="opp"><img src="../assets/teams/og.png"><div class="win">победа</div></div>
<div class="num"><b>0:41</b><small>и команда сдалась</small></div>
<div class="stamp">GG</div>
<div class="wm">@admiral8dota</div>
<script>
// Логотип вписывается в круг-прожектор: рамка 600×560 по центру круга
const im = document.getElementById("logo");
im.onload = () => {
  const k = Math.min(600 / im.naturalWidth, 560 / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  im.style.width = w + "px"; im.style.left = (390 - w / 2) + "px"; im.style.top = (840 - h / 2) + "px";
};
</script>
</body>
</html>
