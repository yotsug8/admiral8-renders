# Скачать рендеры героев, вырезать фон и сложить в ветку assets (для макетов)
name: assets

on:
  workflow_dispatch:
    inputs:
      heroes:
        description: "ключи героев через пробел"
        default: ""
      items:
        description: "ключи предметов через пробел"
        default: ""
      abilities:
        description: "ключи способностей через пробел"
        default: ""
      teams:
        description: "названия команд через ; (логотипы из OpenDota)"
        default: ""
      liquipedia:
        description: "страницы Liquipedia через ; (скачать логотипы команд)"
        default: ""
      lqprefix:
        description: "префиксы имён файлов Liquipedia через ; (скачать все совпадения)"
        default: ""
      sounds:
        description: "префиксы звуковых файлов Dota 2 Wiki через ; (например Kunkka;Torrent)"
        default: ""
      anims:
        description: "ключи героев через пробел: анимированный рендер webm → кадры webp"
        default: ""
      textures:
        description: "текстуры Poly Haven (CC0) через пробел; ?категория — только список (например ?wood ?metal)"
        default: ""

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - if: ${{ inputs.heroes != '' }}
        run: pip install -q "rembg[cpu]"                # вырезать фон — только если просили героев (ставится долго)
      - if: ${{ inputs.anims != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg      # для анимированных рендеров
      - name: Скачать и вырезать
        env:
          HEROES: ${{ inputs.heroes }}
          ITEMS: ${{ inputs.items }}
          ABILITIES: ${{ inputs.abilities }}
          TEAMS: ${{ inputs.teams }}
          LIQUIPEDIA: ${{ inputs.liquipedia }}
          LQPREFIX: ${{ inputs.lqprefix }}
          ANIMS: ${{ inputs.anims }}
          SOUNDS: ${{ inputs.sounds }}
          TEXTURES: ${{ inputs.textures }}
        run: |
          set +e                                   # любая ошибка — в лог, ветка всё равно пушится
          mkdir -p a
          python - 2>> a/err.txt <<'PY'
          import os, urllib.request, io
          from PIL import Image
          if os.environ["HEROES"].split():
              from rembg import remove
          import sys, re, json
          sys.stdout = open("a/log.txt", "w")      # лог кладём в ветку: логи Actions мне недоступны
          CDN = "https://cdn.cloudflare.steamstatic.com/apps/dota2"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=30).read())).convert("RGBA")
          for k in os.environ["HEROES"].split():
              try:                                 # один неверный ключ не роняет остальных
                  im = get(f"{CDN}/videos/dota_react/heroes/renders/{k}.png")
                  print(k, im.size, "альфа min:", im.getextrema()[3][0])
                  if im.getextrema()[3][0] >= 250:
                      im = remove(im).convert("RGBA")
                  bb = im.getchannel("A").point(lambda a: 255 if a > 24 else 0).getbbox()
                  im.crop(bb).save(f"a/hero_{k}.png")
              except Exception as e: print("герой", k, "ошибка:", e)
          for k in os.environ["ITEMS"].split():
              try: get(f"{CDN}/images/dota_react/items/{k}.png").save(f"a/item_{k}.png")
              except Exception as e: print("предмет", k, "ошибка:", e)
          for k in os.environ.get("ABILITIES", "").split():
              try: get(f"{CDN}/images/dota_react/abilities/{k}.png").save(f"a/ability_{k}.png")
              except Exception as e: print("способность", k, "ошибка:", e)
          # Логотипы команд: ищем по названию в списке команд OpenDota
          names = [n.strip() for n in os.environ.get("TEAMS", "").split(";") if n.strip()]
          if names:
              req = urllib.request.Request("https://api.opendota.com/api/teams", headers={"User-Agent": "Mozilla/5.0"})
              teams = json.loads(urllib.request.urlopen(req, timeout=60).read())
              for n in names:
                  hits = [t for t in teams if (t.get("name") or "").lower() == n.lower()] or \
                         [t for t in teams if n.lower() in (t.get("name") or "").lower()]
                  for t in hits[:3]:
                      print("команда", n, "->", t["team_id"], t["name"], t.get("tag"), t.get("logo_url"))
                  if hits and hits[0].get("logo_url"):
                      slug = re.sub(r"\W+", "_", n.lower())
                      get(hits[0]["logo_url"]).save(f"a/team_{slug}.png")
                  else:
                      print("команда", n, ": логотип не найден")
          # Логотипы с Liquipedia: все файлы-логотипы со страницы команды (прозрачный PNG)
          import gzip, json, urllib.parse
          def lq(params, wiki="dota2"):
              url = f"https://liquipedia.net/{wiki}/api.php?" + urllib.parse.urlencode(dict(params, format="json"))
              req = urllib.request.Request(url, headers={"User-Agent": "admiral8-renders/1.0 (github.com/yotsug8)", "Accept-Encoding": "gzip"})
              raw = urllib.request.urlopen(req, timeout=60).read()
              try: raw = gzip.decompress(raw)
              except OSError: pass
              return json.loads(raw)
          for page in [p.strip() for p in os.environ.get("LIQUIPEDIA", "").split(";") if p.strip()]:
              try:
                  imgs = lq({"action": "query", "titles": page, "prop": "images", "imlimit": 100})
                  files = [i["title"] for pg in imgs["query"]["pages"].values() for i in pg.get("images", [])]
                  print(page, "файлы:", files)
                  logos = [f for f in files if any(w in f.lower() for w in ("logo", "allmode", "darkmode", "lightmode", "full"))][:8]
                  if not logos:
                      logos = [f for f in files if f.lower().endswith(".png")][:8]
                  info = lq({"action": "query", "titles": "|".join(logos), "prop": "imageinfo", "iiprop": "url|size"})
                  for pg in info["query"]["pages"].values():
                      ii = (pg.get("imageinfo") or [{}])[0]
                      if not ii.get("url"): continue
                      name = re.sub(r"\W+", "_", pg["title"].split(":", 1)[1].rsplit(".", 1)[0])
                      im = get(ii["url"]); im.save(f"a/lq_{name}.png")
                      print("  скачан", pg["title"], im.size, ii["url"])
              except Exception as e:
                  print(page, "ошибка:", e)
              import time; time.sleep(3)          # Liquipedia просит не чаще раза в пару секунд
          # Звуки игры с Dota 2 Wiki (fandom): все аудиофайлы с заданными префиксами
          for pre in [p.strip() for p in os.environ.get("SOUNDS", "").split(";") if p.strip()]:
              try:
                  url = "https://dota2.fandom.com/api.php?" + urllib.parse.urlencode(dict(action="query", list="allimages", aiprefix=pre.replace(" ", "_"),
                        ailimit=500, aiprop="url|mime|size", format="json"))
                  req = urllib.request.Request(url, headers={"User-Agent": "admiral8-renders/1.0 (github.com/yotsug8)"})
                  res = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  aud = [i for i in res["query"]["allimages"] if i.get("mime", "").startswith("audio")]
                  print("звуки", pre, "найдено:", len(aud), "из", len(res["query"]["allimages"]))
                  os.makedirs("a/snd", exist_ok=True)
                  for i in aud[:80]:
                      name = re.sub(r"[^\w.-]+", "_", i["name"])
                      req = urllib.request.Request(i["url"], headers={"User-Agent": "Mozilla/5.0"})
                      open(f"a/snd/{name}", "wb").write(urllib.request.urlopen(req, timeout=60).read())
                      print("  ", name, i.get("size"))
              except Exception as e:
                  print("звуки", pre, "ошибка:", e)
          for pre in [p.strip() for p in os.environ.get("LQPREFIX", "").split(";") if p.strip()]:
              try:
                  res = lq({"action": "query", "list": "allimages", "aiprefix": pre.replace(" ", "_"), "ailimit": 15, "aiprop": "url|size"}, "commons")   # логотипы лежат в общем хранилище
                  print(pre, "найдено:", len(res["query"]["allimages"]))
                  for ii in res["query"]["allimages"]:
                      name = re.sub(r"\W+", "_", ii["name"].rsplit(".", 1)[0])
                      if not ii["name"].lower().endswith(".png"): continue
                      im = get(ii["url"]); im.save(f"a/lq_{name}.png")
                      print("  скачан", ii["name"], im.size)
              except Exception as e:
                  print(pre, "ошибка:", e)
              import time; time.sleep(3)
          # Текстуры Poly Haven (лицензия CC0): «?категория» — список ключей в лог, иначе — цветовая карта 2K в a/tex/
          for t in os.environ.get("TEXTURES", "").split():
              try:
                  if t.startswith("?"):
                      res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.polyhaven.com/assets?t=textures&c={t[1:]}", headers={"User-Agent": "admiral8-renders/1.0"}), timeout=60).read())
                      print("текстуры", t[1:], ":", " ".join(sorted(res)))
                      continue
                  fl = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.polyhaven.com/files/{t}", headers={"User-Agent": "admiral8-renders/1.0"}), timeout=60).read())
                  url = fl["Diffuse"]["2k"]["jpg"]["url"]
                  os.makedirs("a/tex", exist_ok=True)
                  open(f"a/tex/{t}.jpg", "wb").write(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read())
                  print("текстура", t, url)
              except Exception as e:
                  print("текстура", t, "ошибка:", e)
          PY
          # Анимированные рендеры: webm с альфой (VP9) → кадры webp без потерь, родная частота, полный размер, общий кроп по всем кадрам
          for k in $ANIMS; do
            curl -sfL -A "Mozilla/5.0" -o "a/anim_$k.webm" "https://cdn.cloudflare.steamstatic.com/apps/dota2/videos/dota_react/heroes/renders/$k.webm" || { echo "$k: нет webm" >> a/log.txt; continue; }
            mkdir -p "a/anim_$k"
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name,r_frame_rate -of compact "a/anim_$k.webm" >> a/log.txt 2>&1
            # родная частота кадров — в meta.json (раньше брали 15 к/с, анимация шла рывками)
            ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "a/anim_$k.webm" | python -c "import sys,json; a,b=sys.stdin.read().strip().split('/'); json.dump({'fps': float(a)/float(b)}, open('a/anim_$k/meta.json','w'))"
            ffmpeg -v error -c:v libvpx-vp9 -i "a/anim_$k.webm" "a/anim_$k/%03d.png" 2>> a/log.txt \
              || ffmpeg -v error -i "a/anim_$k.webm" "a/anim_$k/%03d.png" 2>> a/log.txt || echo "$k: ffmpeg не смог" >> a/log.txt
            python - "$k" 2>> a/err.txt <<'PY'
          import sys, glob
          from PIL import Image
          k = sys.argv[1]
          fs = sorted(glob.glob(f"a/anim_{k}/*.png"))
          box = None
          for f in fs:
              b = Image.open(f).getchannel("A").point(lambda a: 255 if a > 24 else 0).getbbox()
              if b: box = b if box is None else (min(box[0], b[0]), min(box[1], b[1]), max(box[2], b[2]), max(box[3], b[3]))
          for f in fs:
              im = Image.open(f).convert("RGBA")
              (im.crop(box) if box else im).save(f.replace(".png", ".webp"), lossless=True, method=4)
          print(k, "кадров:", len(fs), "кроп:", box, "альфа min первого:", Image.open(fs[0]).getextrema()[3][0] if fs else None, file=open("a/log.txt", "a"))
          PY
            rm -f "a/anim_$k"/*.png
          done
          cd a
          git init -q -b assets && git add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -q -m assets
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets
